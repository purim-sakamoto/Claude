<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAFETY SHIELD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo">SAFETY SHIELD</span>
      <span class="org">タイキ薬品工業 安全衛生委員会 特別パトロール班</span>
    </div>
    <div class="row">
      <div class="status" id="topStatus"></div>
      <button class="btn small" id="helpBtn" type="button">遊び方</button>
    </div>
  </header>
  <main class="layout">
    <section class="board">
      <div class="canvasWrap" id="canvasWrap">
        <canvas id="map" width="792" height="528" aria-label="作戦マップ"></canvas>
        <div class="hud" id="hud" hidden>
          <span class="hud-time" id="hudTime">0:00</span>
          <span class="hud-alarm" id="hudAlarm" hidden>全館通報中</span>
          <span class="hud-score" id="hudScore">0</span>
        </div>
      </div>
      <p class="hint" id="boardHint"></p>
      <ul class="legend-bar" aria-label="凡例">
        <li><span class="lg hz">▲</span>不安全箇所</li>
        <li><span class="lg en">●</span>工場員と見張り範囲</li>
        <li><span class="lg ent">■</span>進入口</li>
        <li><span class="lg lock">▦</span>施錠扉</li>
        <li class="muted">左クリック: 地点を置く / 右クリック: 取り消す</li>
      </ul>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
</div>
<div class="modal" id="help" hidden></div>
<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/game.js"></script>
</body>
</html>
