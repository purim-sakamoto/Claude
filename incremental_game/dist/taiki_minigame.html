<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイキ薬品工業　ミニゲーム</title>
<style>
/* 色は時代ごとに切り替える（body[data-era]） */
:root {
  --bg: #000; --fg: #ddd; --dim: #777; --line: #333; --btn: #111; --btnfg: #eee; --btnline: #555;
  --accent: #c9a36a; --bad: #d46a5a; --good: #7fb07f; --warn: #d2a24c; --panel: #0a0a0a; --bar: #555; --story: #fff;
}
body[data-era="1"] { --bg: #17120e; --fg: #e6dccd; --dim: #8a7c6a; --line: #3a3027; --btn: #221a14; --btnfg: #f0e6d6; --btnline: #5e4d3c; --panel: #1d1712; --bar: #8a6a45; --accent: #d6a463; --story: #fff4e0; }
body[data-era="2"], body[data-era="3"] { --bg: #ecebe7; --fg: #222; --dim: #777; --line: #cfccc5; --btn: #fff; --btnfg: #222; --btnline: #aaa59b; --panel: #f6f5f2; --bar: #7b8b9a; --accent: #8a5a2b; --bad: #b0473a; --good: #3f7f4f; --warn: #a8741a; --story: #000; }
body[data-era="3"] { --bg: #e7ecee; --panel: #f3f6f7; --bar: #4f7f99; }
body[data-era="4"] { --bg: #e6ece6; --fg: #1f2a22; --dim: #6c786f; --line: #c8d3ca; --btn: #fff; --btnfg: #1f2a22; --btnline: #9fb0a3; --panel: #f2f6f2; --bar: #4f8a62; --accent: #2f6f4a; --bad: #b0473a; --good: #2f7f4f; --warn: #a8741a; --story: #000; }
body[data-era="5"] { --bg: #0c1222; --fg: #d8e0f0; --dim: #7584a3; --line: #243150; --btn: #131c33; --btnfg: #e6ecff; --btnline: #3a4a73; --panel: #10182c; --bar: #5f7fc0; --accent: #9fb8ff; --story: #fff; }
body[data-era="6"] { --bg: #04050b; --fg: #d7d4e8; --dim: #6e6a8a; --line: #1b1a2e; --btn: #0b0b18; --btnfg: #eeeaff; --btnline: #34305a; --panel: #08081a; --bar: #8c79d6; --accent: #c9b8ff; --story: #fff; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; font-size: 14px; transition: background 2s, color 2s; }
button { font: inherit; }
.hidden { display: none !important; }
.dim { color: var(--dim); }
.bad { color: var(--bad); }
.good { color: var(--good); }
.warn { color: var(--warn); }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 1280px; margin: 0 auto; padding: 8px 16px 40px; }
#top { display: flex; gap: 16px; align-items: baseline; min-height: 24px; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
#title { font-size: 12px; color: var(--dim); letter-spacing: .1em; white-space: nowrap; }
#title s { color: var(--dim); }
#memo { flex: 1; font-size: 13px; }
#memo b { color: var(--accent); font-weight: normal; margin-right: 6px; }
#cal { font-size: 12px; color: var(--dim); white-space: nowrap; }

#main { display: grid; grid-template-columns: 260px 1fr 260px; gap: 18px; align-items: start; }
#logcol { position: sticky; top: 8px; max-height: calc(100vh - 70px); overflow: hidden; }
#log { font-size: 13px; line-height: 1.6; }
#log div { margin-bottom: 6px; opacity: 1; transition: opacity .8s; }
#log div.story { color: var(--story); }
#log div.dim { color: var(--dim); }
#log div:nth-child(n+10) { opacity: .6; }
#log div:nth-child(n+20) { opacity: .35; }
#event { margin-bottom: 8px; }
#event .ev { border: 1px dashed var(--accent); padding: 6px 8px; font-size: 13px; }
#event button { margin-top: 4px; }
#side { position: sticky; top: 8px; max-height: calc(100vh - 70px); overflow-y: auto; }

/* 導入の画面（ログとボタンだけ） */
body.intro #main { grid-template-columns: 1fr; max-width: 520px; margin: 40px auto 0; }
body.intro #side, body.intro #tabs, body.intro #top #memo, body.intro #top #cal { display: none; }
body.intro #logcol { order: 2; position: static; max-height: none; }
body.intro #center { order: 1; }
body.intro #top { border-bottom: none; }
body.intro.noresources #side { display: none; }
body.intro.hasresources #main { grid-template-columns: 1fr 210px; grid-template-areas: "act res" "log res"; max-width: 660px; }
body.intro.hasresources #center { grid-area: act; }
body.intro.hasresources #logcol { grid-area: log; }
body.intro.hasresources #side { display: block; grid-area: res; position: static; }

.btn { display: inline-block; background: var(--btn); color: var(--btnfg); border: 1px solid var(--btnline); padding: 6px 12px; margin: 0 6px 6px 0; cursor: pointer; position: relative; overflow: hidden; text-align: left; border-radius: 2px; }
.btn:hover { border-color: var(--accent); }
.btn.na { opacity: .45; cursor: default; }
.btn .prog { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); }
.btn small { display: block; color: var(--dim); font-size: 11px; }
.mini { background: var(--btn); color: var(--btnfg); border: 1px solid var(--btnline); padding: 1px 7px; cursor: pointer; font-size: 12px; margin-left: 2px; border-radius: 2px; }
.mini:hover { border-color: var(--accent); }
.fade { animation: fadein .9s ease both; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
body.noanim .fade { animation: none; }

#tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
#tabs button { background: none; border: none; color: var(--dim); padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent; }
#tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
#tabs button.new::after { content: "●"; color: var(--accent); font-size: 8px; vertical-align: super; margin-left: 2px; }
#actions:empty { display: none; }
#actions { margin-bottom: 8px; }

/* 資源 */
.res { display: grid; grid-template-columns: 1fr auto; gap: 0 6px; font-size: 13px; padding: 2px 0; border-bottom: 1px dotted var(--line); }
.res .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .v { text-align: right; font-variant-numeric: tabular-nums; }
.res .r { grid-column: 1 / 3; text-align: right; font-size: 11px; color: var(--dim); min-height: 0; }
.res.full .v { color: var(--warn); }
.res.neg .r { color: var(--bad); }
.resgroup { font-size: 11px; color: var(--dim); margin: 10px 0 2px; letter-spacing: .1em; }

/* 設備など */
.group { margin-bottom: 14px; }
.group h3 { font-size: 12px; color: var(--dim); font-weight: normal; margin: 0 0 6px; letter-spacing: .1em; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.row .btn { flex: 0 0 auto; min-width: 190px; margin: 0; }
.row .info { flex: 1; font-size: 12px; color: var(--dim); padding-top: 2px; }
.row .info .st { color: var(--fg); }
.row .ctl { white-space: nowrap; font-size: 12px; padding-top: 4px; }
.cost { font-size: 11px; }
.cost .lack { color: var(--bad); }
.teaser { color: var(--dim); opacity: .55; font-size: 12px; display: inline-block; border: 1px dashed var(--line); padding: 3px 8px; margin: 0 6px 6px 0; }
.bar { height: 6px; background: var(--line); position: relative; margin-top: 3px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); }
.bar.red i { background: var(--bad); }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: right; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th { color: var(--dim); font-weight: normal; }
.flow { font-size: 12px; padding: 5px 0; border-bottom: 1px dotted var(--line); }
.flow .io { color: var(--dim); }
.flow .why { color: var(--bad); }
.card { border: 1px solid var(--line); padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
.card .steps { display: flex; gap: 2px; margin: 6px 0; }
.card .steps span { flex: 1; height: 5px; background: var(--line); }
.card .steps span.done { background: var(--bar); }
.card .steps span.cur { background: var(--accent); }
p.note { font-size: 12px; color: var(--dim); margin: 0 0 10px; }

#gear { position: fixed; right: 14px; bottom: 12px; background: none; border: none; color: var(--dim); font-size: 20px; cursor: pointer; opacity: .6; }
#gear:hover { opacity: 1; }

#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
#modalbox { background: var(--panel); color: var(--fg); border: 1px solid var(--btnline); padding: 18px 20px; max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; }
#modalbox h2 { font-size: 16px; font-weight: normal; margin: 0 0 12px; }
#modalbox textarea, #modalbox input[type=text], #modalbox input[type=password] { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--btnline); padding: 6px; font-family: monospace; font-size: 12px; }
#modalbox textarea { height: 110px; }
#modalbox .sect { margin: 12px 0; }
#modalbox label { display: block; margin: 6px 0; font-size: 13px; }

#devpanel { position: fixed; right: 12px; bottom: 44px; width: 300px; background: #111; color: #eee; border: 1px solid #c33; padding: 10px; font-size: 12px; z-index: 40; max-height: 70vh; overflow-y: auto; }
#devpanel h4 { margin: 0 0 6px; color: #f66; font-weight: normal; }
#devpanel button { background: #222; color: #eee; border: 1px solid #555; padding: 3px 7px; margin: 2px; cursor: pointer; font-size: 12px; }
#devpanel button.on { border-color: #f66; color: #f88; }
#devpanel pre { white-space: pre-wrap; font-size: 11px; color: #ccc; margin: 6px 0 0; }

#ending { position: fixed; inset: 0; background: #000; color: #ddd; z-index: 60; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px; }
#ending .line { margin: 10px 0; font-size: 15px; }
#ending .btn { background: #000; color: #eee; border-color: #666; }
#ending .credits { max-width: 520px; line-height: 2; font-size: 13px; color: #aaa; }

@media (max-width: 960px) {
  #main { grid-template-columns: 1fr; }
  #side { position: static; max-height: none; order: 1; }
  #center { order: 2; }
  #logcol { position: static; max-height: 220px; overflow-y: auto; order: 3; }
  .row { flex-wrap: wrap; }
  .row .btn { min-width: 0; width: 100%; }
  #side #resources { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
}

</style>

<script>
/* 汎用関数。全ファイル共通の名前空間 TM を用意する（file:// で動かすため ES Modules は使わない） */
var TM = window.TM = window.TM || {};

TM.util = (function () {
  var UNITS = [
    [1e68, '無量大数'], [1e64, '不可思議'], [1e60, '那由他'], [1e56, '阿僧祇'], [1e52, '恒河沙'],
    [1e48, '極'], [1e44, '載'], [1e40, '正'], [1e36, '澗'], [1e32, '溝'], [1e28, '穣'],
    [1e24, '𥝱'], [1e20, '垓'], [1e16, '京'], [1e12, '兆'], [1e8, '億'], [1e4, '万']
  ];

  function trim(x, digits) {
    var s = x.toFixed(digits);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  /* 数値を日本語の命数で整形する。expo=true なら指数表記 */
  function fmt(n, expo) {
    if (n === null || n === undefined || isNaN(n)) return '0';
    if (!isFinite(n)) return '∞';
    var neg = n < 0; if (neg) n = -n;
    var out;
    if (n < 1e4) {
      out = n >= 100 ? trim(Math.floor(n), 0) : n >= 10 ? trim(n, 1) : trim(n, 2);
    } else if (expo) {
      out = n.toExponential(2).replace('e+', 'e');
    } else {
      out = null;
      for (var i = 0; i < UNITS.length; i++) {
        if (n >= UNITS[i][0]) {
          var v = n / UNITS[i][0];
          out = (v >= 1000 ? trim(v, 0) : v >= 100 ? trim(v, 1) : trim(v, 2)) + UNITS[i][1];
          break;
        }
      }
      if (out === null) out = n.toExponential(2);
    }
    return (neg ? '-' : '') + out;
  }

  /* 毎秒の値。小さい値は分あたりで見せる */
  function fmtRate(r, expo) {
    if (Math.abs(r) < 1e-9) return '';
    var sign = r > 0 ? '+' : '';
    if (Math.abs(r) < 0.1) return sign + fmt(r * 60, expo) + '/分';
    return sign + fmt(r, expo) + '/秒';
  }

  function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) return '—';
    sec = Math.ceil(sec);
    if (sec < 60) return sec + '秒';
    if (sec < 3600) return Math.floor(sec / 60) + '分' + (sec % 60 ? (sec % 60) + '秒' : '');
    if (sec < 86400) return Math.floor(sec / 3600) + '時間' + Math.floor((sec % 3600) / 60) + '分';
    return Math.floor(sec / 86400) + '日' + Math.floor((sec % 86400) / 3600) + '時間';
  }

  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if (children) for (var i = 0; i < children.length; i++) {
      var c = children[i];
      if (c === null || c === undefined) continue;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return e;
  }

  /* 決定的な乱数（シミュレータで再現性を持たせる） */
  function rng(state) {
    state.seed = (state.seed * 1664525 + 1013904223) >>> 0;
    return state.seed / 4294967296;
  }

  function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

  return { fmt: fmt, fmtRate: fmtRate, fmtTime: fmtTime, clamp: clamp, el: el, rng: rng, deepCopy: deepCopy };
})();

</script>

  /* ================= 条件判定 ================= */
  function cond(s, c) {

    /* ---- 荷役（需要を先に見積もる） ---- */
    var handleW = s.jobs.handle || 0;
    var forks = Math.min(s.bld.fork ? s.bld.fork.n : 0, handleW, s.lic.fork || 0);
    if (m['auto.fork']) forks = s.bld.fork ? s.bld.fork.n : 0;
    if (forks > 0) s.stats.forkUsed = 1;
    d.forkStat = { n: s.bld.fork ? s.bld.fork.n : 0, manned: forks };
    var handSup = (C.baseHandling + Math.max(0, handleW - (m['auto.fork'] ? 0 : forks)) * JOB.handle.rate * mul(m, 'job.handle') * jobAll
      + forks * sumEffectPer('fork', 'forklift') * d.powerEff * mul(m, 'forklift') + ((s.lic.crane > 0 || m['auto.fork']) ? sumEffect(s, 'crane') : 0) * d.powerEff + sumEffect(s, 'autohandle') * d.powerEff) * mul(m, 'handling');
    d.handSup = handSup;
    var handDem = 0;
    D.buildings.forEach(function (b) {
      if (!b.proc || !b.proc.handling) return;
      var on = b.proc.toggle ? s.bld[b.id].on : s.bld[b.id].n;
      handDem += b.proc.handling * on * glob;
    });
    var shipPlan = planShipping(s, d, m, glob);
    handDem += shipPlan.handling;
    d.handDem = handDem;
    d.handEff = handDem > 0 ? Math.min(1, handSup / handDem) : 1;
    if (d.handEff < 0.9 && s.era >= 1 && handDem > 0.5) s.flags.handling_short = true;

    /* ---- 汎用プロセス ---- */
    function run(key, name, inp, out, units, reasonPre, spill) {
      /* units: 1秒あたりの実行量 × dt を掛ける前 */
      var want = units * dt, ratio = 1, reason = reasonPre || null, k;
      if (want <= 0) { d.procs.push({ key: key, name: name, inp: inp, out: out, rate: 0, want: units, eff: 0, reason: reason || '停止' }); return 0; }
      for (k in inp) {
        var need = inp[k] * want;
        var avail = k === 'money' ? s.res.money + d.creditLimit : s.res[k];
        if (need > 0 && avail < need) { var rr = Math.max(0, avail) / need; if (rr < ratio) { ratio = rr; reason = '入力不足：' + resName(s, k); } }
      }
      for (k in out) {
        if (out[k] <= 0 || (spill && spill.indexOf(k) >= 0)) continue;
        var space = d.cap[k] - s.res[k], prod = out[k] * want;
        if (prod > space) { var r2 = Math.max(0, space) / prod; if (r2 < ratio) { ratio = r2; reason = '置き場が満杯：' + resName(s, k); } }
      }
      for (k in inp) { s.res[k] -= inp[k] * want * ratio; if (k === 'money') finExp(s, name, inp[k] * want * ratio); }
      for (k in out) { s.res[k] += out[k] * want * ratio; s.stats.produced[k] = (s.stats.produced[k] || 0) + out[k] * want * ratio; if (k === 'money') finInc(s, name, out[k] * want * ratio); }
      d.procs.push({ key: key, name: name, inp: inp, out: out, rate: units * ratio, want: units, eff: ratio, reason: ratio < 0.999 ? reason : (reasonPre || null) });
      return ratio;
    }

    /* 店売り（壺の時代から） */
    if (s.flags.sold) {
      s.walkin = Math.min(C.walkinCap * mul(m, 'shop'), s.walkin + C.walkinRefill * mul(m, 'shop') * dt);
      if (s.era >= 1) {
        var sell = Math.min(s.walkin, s.res.fecl2, C.walkinRefill * (m.shop ? 2 : 0.6) * dt);
        if (sell > 0) { s.walkin -= sell; s.res.fecl2 -= sell; var inc = sell * C.walkinPrice; s.res.money += inc; finInc(s, '店売り', inc); }
      }
      if (s.walkin < 0.5 && s.res.fecl2 >= 20 && s.era >= 1) s.flags.walkin_empty = true;
    }

    /* 配属（汎用の入出力） */
    D.jobs.forEach(function (j) {
      if (j.special) return;
      var w = s.jobs[j.id] || 0; if (!w) return;
      if (j.slotsFrom) w = Math.min(w, d.slots[j.slotsFrom] || 0);
      var rate = w * mul(m, 'job.' + j.id) * jobAll * glob;
      if (j.fumes) rate *= d.ventEff;
      var r = run('job.' + j.id, j.name, j.in, j.out, rate, (j.slotsFrom && s.jobs[j.id] > w) ? '釜が足りない' : null);
      if (j.fumes) fumesNow += j.out.fecl2 * rate * r;
      if (j.id === 'wash') s.stats.washed += j.out.can * rate * r * dt;
    });

    /* 設備のプロセス */
    D.buildings.forEach(function (b) {
      var p = b.proc; if (!p || !p.out || b.stages) return;
      var n = s.bld[b.id].n; if (!n) return;
      var on = p.toggle ? s.bld[b.id].on : n;
      var reason = null;
      if (p.operator === 'operate') { if (opActive[b.id] < on) reason = '運転の人手が足りない'; on = opActive[b.id]; }
      if (p.needs && !(s.bld[p.needs] && s.bld[p.needs].n > 0)) { on = 0; reason = '必要な設備がない'; }
      var eff = mul(m, 'bld.' + b.id) * glob;
      if (p.power) { eff *= d.powerEff; if (d.powerEff < 0.999) reason = reason || '電力不足'; }
      if (p.handling) { eff *= d.handEff; if (d.handEff < 0.999) reason = reason || '荷役が足りない'; }
      if (p.fumes) eff *= d.ventEff;
      var outM = mul(m, 'bld.' + b.id + '.out');
      var outs = p.out;
      if (outM !== 1) { outs = {}; for (var k in p.out) outs[k] = p.out[k] * outM; }
      var r = run('bld.' + b.id, b.name, p.in || {}, outs, on * eff, on === 0 && n > 0 ? (reason || '停止中') : reason, p.spill);
      if (p.fumes) fumesNow += (p.out.fecl2 || p.out.fecl3w || 0) * on * eff * r;
      if (b.id === 'chlor') s.stats.fecl3 += p.out.fecl3w * on * eff * r * dt;
      if (b.id === 'conc') s.stats.fecl3h += p.out.fecl3h * on * eff * r * dt;
    });

    /* スクラバーで回収した希塩酸、水素の回収 */
    if (d.hclRecoverEff === undefined) d.hclRecoverEff = 0;
    var hclRec = sumEffect(s, 'hclRecover') * d.powerEff;
    if (hclRec > 0 && fumesNow > 0) s.res.hcl = Math.min(d.cap.hcl, s.res.hcl + fumesNow * Math.min(0.3, hclRec) * dt * 0.66);
    var h2cap = sumEffect(s, 'h2rec') * d.powerEff * glob;
    s.stats.h2 += fumesNow * 0.02 * dt;
    if (h2cap > 0 && RES.h2) {
      var h2 = Math.min(fumesNow * 0.02 + (d.h2Extra || 0), h2cap) * dt;
      s.res.h2 = Math.min(d.cap.h2, s.res.h2 + h2);
    }
    d.fumesPrev = fumesNow; d.fumes = fumesNow;

    /* 検査（ロット判定） */
    var checkW = s.jobs.check || 0;
    var checkCap = (checkW * 0.6 * mul(m, 'job.check') * jobAll + sumEffect(s, 'checkCap') * d.powerEff * mul(m, 'job.check')) * mul(m, 'check') * glob;
    d.checkCap = checkCap;
    var lots = D.lots || [];
    var waitTot = 0; lots.forEach(function (l) { waitTot += Math.max(0, s.res[l.wait]); });
    var checked = 0;
    lots.forEach(function (l) {
      if (waitTot <= 0) return;
      var share = checkCap * dt * (Math.max(0, s.res[l.wait]) / waitTot);
      var mv = Math.min(share, s.res[l.wait], Math.max(0, d.cap[l.ok] - s.res[l.ok]));
      s.res[l.wait] -= mv; s.res[l.ok] += mv; checked += mv;
    });
    d.checkUsed = dt > 0 ? checked / dt : 0;

    /* 充填 */
    doFill(s, d, m, dt, jobAll, glob);

    /* 出荷・販売 */
    doShipping(s, d, m, dt, shipPlan, glob);

    /* 戻り缶・使用済み液 */
    var retMove = s.returnPipe * Math.min(1, 0.004 * dt);
    s.returnPipe -= retMove;
    if (s.res.dcan !== undefined) s.res.dcan = Math.min(d.cap.dcan, s.res.dcan + retMove);
    if (RES.spent) {
      var spMove = s.spentPipe * Math.min(1, 0.004 * dt);

    }

    /* 排水 */
    var allow = (D.consts.wasteFree || 0.05) * dt;
    s.res.waste = Math.max(0, s.res.waste - allow);
    if (s.res.waste >= d.cap.waste * 0.95) s.flags.waste_full = true;

    /* 受託 */
    doContracts(s, d, m, dt, glob);

    /* 給与と人の増加 */
    /* 給料は手持ちから払う（借金にはしない）。払えないと手が鈍る */
    var sal = s.pop * C.salary * eraSal * mul(m, 'salary') * dt;
    var paid = Math.min(sal, Math.max(0, s.res.money));
    s.res.money -= paid; finExp(s, '給与', paid);
    if (paid < sal * 0.999 && sal > 0) s.flags.broke = true; else if (s.res.money > 0) s.flags.broke = false;
    if (s.res.money < -d.creditLimit) s.res.money = -d.creditLimit;
    if (s.res.money < 0) s.flags.oncredit = true;
    s.incAvg = (s.incAvg || 0) + ((d.income || 0) - (s.incAvg || 0)) * Math.min(1, dt / 600);
    if (s.era >= 1 && s.pop < d.popCap && s.flags.hired && !s.flags.broke && s.res.money > 0) {
      s.popTimer += dt * mul(m, 'arrival');
      var need = C.arrivalSec * (1 + s.pop * 0.02);
      if (s.popTimer >= need) { s.popTimer = 0; s.pop++; if (s.pop <= 12 || s.pop % 10 === 0) addLog(s, '人がひとり増えた。（' + s.pop + '人）', 'dim'); }
    }

    /* 講習 */
    for (var i = s.training.length - 1; i >= 0; i--) {
      s.training[i].remain -= dt;
      if (s.training[i].remain <= 0) { var L = LIC[s.training[i].lic]; s.lic[L.id]++; addLog(s, L.name + 'の資格を取った。'); s.training.splice(i, 1); }
    }

        s.res.fecl2 = Math.min(d.cap.fecl2 + 3, s.res.fecl2 + C.manualBatch.fecl2);

      }
    }

    /* 上限処理 */
    for (var rid in s.res) {
      if (s.res[rid] !== s.res[rid] || s.res[rid] === Infinity) s.res[rid] = 0; /* NaN・無限大の保険 */
      if (s.res[rid] < 0 && rid !== 'money') s.res[rid] = 0;

    if (s.res.fecl2 > d.cap.fecl2 + 3) s.res.fecl2 = d.cap.fecl2 + 3;
    if (s.res.research > d.cap.research) s.res.research = d.cap.research;

    for (var r2 in s.res) {

    }

    /* 敷地 */
    if (d.used >= d.land * 0.85 && s.era >= 1) s.flags.space_tight = true;

    /* 暦・月次・物語・出来事 */
    s.fin.monthT += dt;
    if (s.fin.monthT >= C.monthSec) {
      s.fin.monthT -= C.monthSec;
      var inc = 0, exp = 0, k2;

      s.fin.cur.total = { inc: inc, exp: exp };
      s.fin.hist.unshift(s.fin.cur); if (s.fin.hist.length > 12) s.fin.hist.length = 12;

    }

    checkHook(s);
    doEvents(s, dt);

  }

  /* 酸も液もお金もなく、手が止まっている（ツケで酸を分けてもらえる） */
  function stuck(s) { return s.res.hcl < 2 && s.res.fecl2 < 3 && s.res.money < C.acidBuy.cost; }

  /* 掛けで仕入れられる上限（信用と稼ぎに応じて） */
  function creditLimit(s) {
    if (s.era < 1) return 0;
    return 60 + (s.res.credit || 0) * 5 + Math.max(0, s.incAvg || 0) * 1800;
  }

  function sumEffect(s, key) {
    var t = 0;
    D.buildings.forEach(function (b) {
      if (!b.effects || b.effects[key] === undefined || b.stages) return;
      var n = s.bld[b.id].n; if (!n) return;
      if (b.effects.needs && !(s.bld[b.effects.needs] && s.bld[b.effects.needs].n > 0)) return;
      if (b.effects.needsRes && (s.res[b.effects.needsRes] || 0) < 1) return;
      t += b.effects[key] * n;
    });
    return t;
  }
  function sumEffectPer(bid, key) { return BLD[bid] && BLD[bid].effects ? BLD[bid].effects[key] || 0 : 0; }

  /* ---------------- 充填 ---------------- */
  function lineCap(s, m) {
    var mn = Infinity, worst = null, det = [];
    D.lineModules.forEach(function (mod) {
      var lv = Math.min(mod.levels.length - 1, Math.round(m['line.' + mod.id] || 0));
      var rate = mod.levels[lv][1] * mul(m, 'linespeed');
      det.push({ id: mod.id, name: mod.name, lv: lv, label: mod.levels[lv][0], rate: rate });
      if (rate < mn) { mn = rate; worst = mod.id; }
    });
    return { rate: mn, worst: worst, det: det };
  }

  function doFill(s, d, m, dt, jobAll, glob) {
    var w = s.jobs.fill || 0;
    var lines = s.bld.line ? s.bld.line.n : 0, fillers = s.bld.filler ? s.bld.filler.n : 0;
    var autoLine = m['auto.line'] > 0;
    var lc = lineCap(s, m); d.lineInfo = lc;
    var linesManned = autoLine ? lines : Math.min(lines, Math.floor(w / 2)); w -= autoLine ? 0 : linesManned * 2;
    var fillersManned = autoLine ? fillers : Math.min(fillers, w); w -= autoLine ? 0 : fillersManned;
    var handRate = Math.max(0, w) * JOB.fill.rate * mul(m, 'job.fill') * jobAll;
    var fRate = fillersManned * sumEffectPer('filler', 'filler') * d.powerEff * mul(m, 'filler');
    var lRate = linesManned * lc.rate * d.powerEff;
    var cap = (handRate + fRate + lRate) * glob;
    d.fillCap = cap; d.linesManned = linesManned; d.lineRate = lRate * glob; d.fillersManned = fillersManned;
    if (cap <= 0) return;
    var budget = cap * dt;
    var cands = [];
    D.products.forEach(function (p) {
      if (p.kind !== 'can') return;
      if (p.license && !(s.lic[p.license] > 0)) return;
      if (p.unlock && !cond(s, p.unlock)) return;
      var kg = p.kg || C.canKg;
      var maxBy = Math.min(s.res[p.liquid] / kg, d.cap[p.id] - s.res[p.id]);
      if (p.container === 'can') maxBy = Math.min(maxBy, s.res.can);
      if (maxBy <= 0) return;
      var room = 1 - s.res[p.id] / Math.max(1, d.cap[p.id]);
      cands.push({ p: p, kg: kg, max: maxBy, w: Math.max(0.05, room) * (p.fillWeight || 1) });
    });
    var wsum = 0; cands.forEach(function (c) { wsum += c.w; });
    var filled = 0, lineShare = cap > 0 ? lRate * glob / cap : 0;
    cands.forEach(function (c) {

      if (amt <= 0) return;

      if (c.p.container === 'can') s.res.can -= amt;
      else if (c.p.containerCost) { var cc = amt * c.p.containerCost; s.res.money -= cc; finExp(s, '容器', cc); }
      s.res[c.p.id] += amt; filled += amt;
    });
    d.filled = dt > 0 ? filled / dt : 0;

    if (lines > 0 && Math.round(m['line.weigh'] || 0) < 1) {

      if (s._claimAcc >= 1) {

      }
    }
  }

  /* ---------------- 出荷 ---------------- */
  function zoneInfo(s, d, m) {
    /* 缶の輸送力・ゾーン、バルク輸送力・ゾーン */
    var drivers = s.jobs.deliver || 0;
    var lic = {}; for (var k in s.lic) lic[k] = s.lic[k];
    var autoDrv = m['auto.drive'] > 0;
    var vs = d.vehicles.slice().sort(function (a, b) { return (b.t.rate || 0) - (a.t.rate || 0); });
    var canRate = 0, bulkRate = 0, canZone = 0, bulkZone = -1, used = 0, missing = [];
    d.vehStat = {};
    vs.forEach(function (v) {
      var t = v.t, n = v.n;
      var why = null;
      if (t.requires) { for (var i = 0; i < t.requires.length; i++) if (!(s.bld[t.requires[i]] && s.bld[t.requires[i]].n > 0)) { missing.push(t.requires[i]); n = 0; why = '足りない設備：' + BLD[t.requires[i]].name; } }
      var manned = n;
      if (!autoDrv) {
        manned = Math.min(n, drivers - used);
        if (t.license) {
          var pool = t.license === 'jmid' ? (lic.jmid || 0) + (lic.mid || 0) + (lic.big || 0) : t.license === 'mid' ? (lic.mid || 0) + (lic.big || 0) : (lic[t.license] || 0);
          manned = Math.min(manned, pool);
          /* 使った免許を減らす（上位から順に） */
          var left = manned, order = t.license === 'jmid' ? ['jmid', 'mid', 'big'] : t.license === 'mid' ? ['mid', 'big'] : [t.license];
          order.forEach(function (o) { var u2 = Math.min(left, lic[o] || 0); lic[o] = (lic[o] || 0) - u2; left -= u2; });
        }
        manned = Math.max(0, manned); used += manned;
        if (manned < n) why = why || (t.license && manned >= 0 ? '運転手（' + LIC[t.license].name + '・配達の人手）が足りない' : '運転手（配達の人手）が足りない');
      }
      d.vehStat[v.b.id] = { n: v.n, manned: manned, why: why };
      if (manned <= 0) return;

      else { canRate += t.rate * manned; canZone = Math.max(canZone, t.zone); }
    });
    var walkers = autoDrv ? 0 : Math.max(0, drivers - used);
    canRate += walkers * JOB.deliver.rate * mul(m, 'walk') * mul(m, 'job.deliver');
    canZone += (m.zone || 0); bulkZone = bulkZone >= 0 ? bulkZone + (m.zone || 0) : -1;
    var maxZ = D.zones.length - 1;
    return { canRate: canRate * mul(m, 'transport'), bulkRate: bulkRate * mul(m, 'transport') * mul(m, 'bulk'),
      canZone: Math.min(maxZ, canZone), bulkZone: Math.min(maxZ, bulkZone), walkers: walkers, missing: missing };
  }

  function demandOf(s, d, m, p, zone) {
    if (zone < 0) return 0;
    var z = D.zones[zone];
    var season = p.season ? p.season[Math.floor(s.t / C.seasonSec) % 4] : 1;
    var credit = 1 + Math.log(1 + s.res.credit) / Math.LN10 * 0.6;
    var big = 1 + 0.25 * Math.min(8, sumEffect(s, 'bigpack'));
    return big * p.demand * z.demand * mul(m, 'demand') * mul(m, 'demand.' + p.id) * credit * season;
  }
  function priceOf(s, d, m, p, zone) {
    var z = D.zones[Math.max(0, zone)];
    var q = p.quality ? 1 + (m.quality || 0) + sumEffect(s, 'quality') : 1;
    return p.price * z.price * mul(m, 'price') * mul(m, 'price.' + p.id) * q * (s.era >= 4 ? 1 + d.circ * 0.5 : 1);
  }

  function planShipping(s, d, m, glob) {
    var zi = zoneInfo(s, d, m); d.zi = zi;
    var plan = { handling: 0, items: [] };
    var canLeft = zi.canRate * glob, bulkLeft = zi.bulkRate * glob;
    var list = D.products.filter(function (p) { return !p.unlock || cond(s, p.unlock); });
    list = list.slice().sort(function (a, b) { return priceOf(s, d, m, b, 0) / (b.kg || C.canKg) - priceOf(s, d, m, a, 0) / (a.kg || C.canKg); });
    list.forEach(function (p) {
      if (p.license && !(s.lic[p.license] > 0)) return;
      var zone = p.kind === 'bulk' ? zi.bulkZone : p.kind === 'direct' ? (p.zone || 0) : zi.canZone;
      if (p.kind === 'bulk' && zone < 0) return;
      var dem = demandOf(s, d, m, p, zone);
      var stockRes = p.kind === 'bulk' || p.kind === 'direct' ? p.src : p.id;
      var rate = dem;
      if (p.kind === 'can') { rate = Math.min(rate, canLeft); canLeft -= rate; }
      if (p.kind === 'bulk') { rate = Math.min(rate, bulkLeft); bulkLeft -= rate; }
      plan.items.push({ p: p, zone: zone, rate: rate, dem: dem, stock: stockRes });
      if (p.kind === 'can') plan.handling += rate;
      if (p.kind === 'direct') plan.handling += rate * (p.handling || 0);
    });
    plan.canLeft = canLeft; plan.bulkLeft = bulkLeft;
    return plan;
  }

  function doShipping(s, d, m, dt, plan, glob) {
    d.sales = [];
    var totalInc = 0;
    plan.items.forEach(function (it) {
      var p = it.p;
      var want = it.rate * dt;
      if (p.kind === 'can' || p.kind === 'direct') want *= d.handEff;
      var amt = Math.min(want, s.res[it.stock]);
      var price = priceOf(s, d, m, p, it.zone);
      var inc = amt * price;
      if (amt > 0) {
        s.res[it.stock] -= amt;
        s.res.money += inc; totalInc += inc;
        finInc(s, p.name, inc);
        s.stats.sold[p.id] = (s.stats.sold[p.id] || 0) + amt;
        if (p.kind === 'bulk') s.stats.lorryUsed = 1;
        if (p.kind === 'can') {
          s.stats.cansSold += amt;
          s.res.credit += amt * 0.02 * mul(m, 'credit');
          if (p.container === 'can') s.returnPipe += amt * Math.min(0.95, C.returnRate * mul(m, 'return'));
        } else s.res.credit += amt * (p.creditPer || 0.001) * mul(m, 'credit');
        if (p.spent && s.flags.spent_on) s.spentPipe += amt * (p.kind === 'can' ? 20 : 1) * p.spent;
      }
      d.sales.push({ p: p, zone: it.zone, dem: it.dem, rate: dt > 0 ? amt / dt : 0, price: price, cap: it.rate });
    });
    d.income = dt > 0 ? totalInc / dt : 0;
  }

  /* ---------------- 受託 ---------------- */
  function doContracts(s, d, m, dt, glob) {
    var K = s.contracts; if (!D.contracts || !s.techs[D.contracts.tech]) return;
    K.timer -= dt;
    if (K.timer <= 0) {
      K.timer = D.contracts.offerSec;
      if (K.offers.length < 3) {
        var pool = D.contracts.templates.filter(function (t) { return cond(s, t.unlock); });
        if (pool.length) {
          var tpl = pool[Math.floor(U.rng(s) * pool.length)];
          var scale = Math.pow(D.contracts.scaleBase, s.era) * (1 + K.done * 0.15);
          K.offers.push({ id: ++K.seq, tpl: tpl.id, scale: scale });
        }
      }
    }
    var slots = (s.jobs.sales || 0) + (m['sales.slots'] || 0);
    d.contractSlots = slots;
    var running = 0;
    K.active.forEach(function (c) {
      var tpl = tplById(c.tpl);
      if (c.step >= D.contracts.steps.length) {
        /* 継続受託：毎秒の収入と消費 */
        var ok = 1, k;
        for (k in tpl.use) { var need = tpl.use[k] * c.scale * dt; if (need > 0 && s.res[k] < need) ok = Math.min(ok, s.res[k] / need); }
        for (k in tpl.use) s.res[k] -= tpl.use[k] * c.scale * dt * ok;
        var inc = tpl.income * c.scale * ok * glob * dt * mul(m, 'contract');
        s.res.money += inc; finInc(s, '受託', inc);
        c.eff = ok;
        return;
      }
      if (running >= slots) { c.waiting = '営業の人手が足りない'; return; }
      running++;
      var st = D.contracts.steps[c.step];
      var need2 = st.needs ? (tpl.needs || {})[st.id] : null;
      if (need2 && !cond(s, need2)) { c.waiting = '保留：必要な設備・分析がない'; return; }
      c.waiting = null;
      c.prog += dt * mul(m, 'contract.speed');
      if (c.prog >= st.sec) {
        c.prog = 0;
        if (st.id === 'eval') {
          var q = 0.55 + (m.quality || 0) + sumEffect(s, 'quality');
          if (U.rng(s) > Math.min(0.95, q)) { c.step = 1; addLog(s, '受託「' + tpl.name + '」：サンプルが不合格。検討からやり直し。', 'dim'); return; }
        }
        c.step++;
        if (c.step >= D.contracts.steps.length) { K.done++; s.stats.contractsDone = K.done; addLog(s, '受託「' + tpl.name + '」が製品化された。毎月の収入になる。'); }
      }
    });
  }
  function tplById(id) { for (var i = 0; i < D.contracts.templates.length; i++) if (D.contracts.templates[i].id === id) return D.contracts.templates[i]; return null; }

  /* ---------------- 物語・フック・出来事 ---------------- */
  function checkStory(s) {
    D.story.forEach(function (st) {
      if (s.storySeen[st.id]) return;
      if (!cond(s, st.cond)) return;
      s.storySeen[st.id] = true;
      if (st.setFlag) s.flags[st.setFlag] = true;
      s.stats.at[st.id] = s.t;
      addLog(s, st.text, st.cls || 'story');
    });
  }
  function checkHook(s) {
    if (s.era >= 1 && !s.flags.hook && s.t >= Math.max(C.hookSec, (s.stats.at.era1 || 0) + 120)) {
      s.flags.hook = true; s.flags.research_known = true; s.stats.at.hook = s.t;
      addLog(s, '帳面をつけ始めた。考えることが増えた。');
      addLog(s, '夜、釜の液面に星が映っていた。', 'story');
    }
    if (s.flags.hook && !s.flags.memo && s.t >= Math.max(C.memoSec, s.stats.at.hook + 150)) {
      s.flags.memo = true; s.stats.at.memo = s.t;
      addLog(s, '留守のあいだも、釜は溶かし続ける。', 'story');
    }
  }
  function doEvents(s, dt) {
    if (s.era < 1) return;
    if (s.evActive) { s.evActive.left -= dt; if (s.evActive.left <= 0) s.evActive = null; return; }
    s.evTimer -= dt;
    if (s.evTimer > 0) return;
    s.evTimer = 400 + U.rng(s) * 600;
    var pool = D.events.filter(function (e) { return cond(s, e.cond); });
    if (!pool.length) return;
    var e = pool[Math.floor(U.rng(s) * pool.length)];
    s.evActive = { id: e.id, left: 90 };
  }
  function claimEvent(s) {
    if (!s.evActive) return;
    var e = null; D.events.forEach(function (x) { if (x.id === s.evActive.id) e = x; });
    s.evActive = null; if (!e) return;
    var d = derive(s);
    for (var k in e.give) {
      var v = e.give[k];
      var amt = v === 'cap' ? (isFinite(d.cap[k]) ? Math.max(0, d.cap[k] - s.res[k]) * 0.5 : Math.max(10, (d.rate && d.rate[k] > 0 ? d.rate[k] : 0) * 600))
        : v === 'income60' ? Math.max(20, (d.income || 0) * 60) : v;
      s.res[k] += amt;
      if (k === 'money') finInc(s, '臨時', amt);
    }
    addLog(s, e.text + '（受け取った）', 'dim');
  }

  /* ================= プレイヤーの操作 ================= */
  var actions = {
    grope: { vis: function (s) { return !s.flags.groped; }, run: function (s) { s.flags.groped = true; addLog(s, '冷たい。釘が一本。'); } },
    pick: {
      vis: function (s) { return s.flags.groped; },
      label: '拾う',
      run: function (s) {
        var d = derive(s);
        if (s.res.scrap >= d.cap.scrap) return;
        s.res.scrap += 1 * (s.era >= 1 ? mul(d.m, 'job.gather') : 1);
        if (!s.flags.picked) { s.flags.picked = true; addLog(s, '鼻を刺す匂い。壺がある。'); }
      }
    },
    sink: {
      vis: function (s) { return s.flags.picked; },
      label: '沈める',
      busy: function (s) { return s.manual.dissolve > 0; },
      ok: function (s) { return s.res.scrap >= 1 && s.res.hcl >= 2 && s.manual.dissolve <= 0; },
      run: function (s) {
        if (!actions.sink.ok(s)) return;
        s.res.scrap -= C.manualBatch.scrap; s.res.hcl -= C.manualBatch.hcl;
        s.manual.dissolve = C.manualDissolveSec;
        if (!s.flags.sunk) { s.flags.sunk = true; addLog(s, '泡が立つ。釘が、細くなっていく。'); }
      }
    },
    give: {
      vis: function (s) { return s.flags.knock; },
      label: '渡す',
      ok: function (s) { return s.res.fecl2 >= 1 && s.walkin >= 1; },
      run: function (s) {
        var amt = Math.min(s.res.fecl2, s.walkin); if (amt <= 0) return;
        s.res.fecl2 -= amt; s.walkin -= amt;
        var inc = amt * C.walkinPrice; s.res.money += inc; finInc(s, '店売り', inc);
        if (!s.flags.sold) { s.flags.sold = true; addLog(s, '硬貨が手に残る。'); }
      }
    },
    buyacid: {
      vis: function (s) { return s.flags.sold; },
      label: function (s) { return s.flags.acid_known ? '塩酸を買う' : '酸を買う'; },
      ok: function (s) { var d = derive(s); return (s.res.money + creditLimit(s) >= C.acidBuy.cost || stuck(s)) && s.res.hcl < d.cap.hcl; },
      cost: function () { return { money: C.acidBuy.cost }; },
      run: function (s) {
        var d = derive(s); if (!actions.buyacid.ok(s)) return;
        if (s.res.money + creditLimit(s) < C.acidBuy.cost && !s.flags.tab) { s.flags.tab = true; addLog(s, '店の主人が「ツケでいいよ」と塩酸を分けてくれた。'); }
        s.res.money -= C.acidBuy.cost; finExp(s, '仕入れ', C.acidBuy.cost);
        s.res.hcl = Math.min(d.cap.hcl, s.res.hcl + C.acidBuy.kg);
        s.flags.bought_acid = true;
      }
    },
    hire: {
      vis: function (s) { return s.flags.hire_reveal && s.era === 0; },
      label: '人を呼ぶ',
      cost: function (s) { return { money: C.hireBase * Math.pow(C.hireRatio, s.pop) }; },
      ok: function (s) { return s.pop < C.basePop && canPay(s, actions.hire.cost(s)); },
      run: function (s) {
        if (!actions.hire.ok(s)) return;
        pay(s, actions.hire.cost(s), '人件費'); s.pop++; s.jobs.gather++;
        if (!s.flags.hired) { s.flags.hired = true; addLog(s, '近所の若いのが手伝いに来た。鉄くずを集めてくれる。'); }
      }
    },
    setkama: {
      vis: function (s) { return s.flags.kama_reveal && s.era === 0; },
      label: '釜を据える',
      cost: function () { return { money: 60 }; },
      ok: function (s) { return canPay(s, { money: 60 }); },
      run: function (s) {
        if (!actions.setkama.ok(s)) return;
        pay(s, { money: 60 }); s.bld.kama.n = 1; s.era = 1; s.stats.at.era1 = s.t;
        addLog(s, '釜を据えた。湯気の向こうで、何かが始まる。', 'story');
      }
    },
    buycans: {
      vis: function (s) { return s.flags.cans_known; },
      label: 'ポリ缶を買う（5個）',
      cost: function () { return { money: C.canBuy.cost }; },
      ok: function (s) { var d = derive(s); return s.res.money >= C.canBuy.cost && s.res.can + C.canBuy.n <= d.cap.can; },
      run: function (s) {
        if (!actions.buycans.ok(s)) return;
        s.res.money -= C.canBuy.cost; finExp(s, '容器', C.canBuy.cost); s.res.can += C.canBuy.n;
      }
    }
  };

  function doAction(s, id) {
    var a = actions[id]; if (!a) return;
    if (a.vis && !a.vis(s)) return;
    s.stats.clicks++;
    a.run(s);
    if (!s.flags.knock && s.stats.batches >= 2) {
      s.flags.knock = true; s.walkin = 12;
      addLog(s, '戸を叩く音。「その緑の液、譲ってもらえないか」');
    }
    checkStory(s);
  }

  function build(s, id) {
    var b = BLD[id]; if (!b || !bldVisible(s, b)) return false;
    if (b.stages && s.bld[id].n >= b.stages) return false;
    if (b.max && s.bld[id].n >= b.max) return false;
    var d = derive(s);
    if ((b.space || 0) > 0 && d.used + b.space > d.land) return false;
    if (b.buildCond && !cond(s, b.buildCond)) return false;
    var c = cost(s, b); if (!canPay(s, c)) return false;
    pay(s, c, b.stages ? '大型設備' : '設備');
    s.bld[id].n++;
    if (b.proc && b.proc.toggle) s.bld[id].on++;
    if (b.stages && s.bld[id].n >= b.stages && b.onComplete) {
      var oc = b.onComplete;
      if (oc.era !== undefined && s.era < oc.era) { s.era = oc.era; s.stats.at['era' + oc.era] = s.t; }
      if (oc.flag) s.flags[oc.flag] = true;
      if (oc.ending) { s.ending = 1; s.stats.at.ending = s.t; s.stats.ended = 1; }
      addLog(s, b.name + 'が完成した。', 'story');
    }
    return true;
  }
  function sell(s, id) {
    var b = BLD[id]; if (!b || b.stages || s.bld[id].n <= 0) return;
    s.bld[id].n--;
    if (s.bld[id].on > s.bld[id].n) s.bld[id].on = s.bld[id].n;
    var c = cost(s, b, s.bld[id].n);
    for (var k in c) s.res[k] += c[k] * 0.5;
  }
  function setOn(s, id, delta) {
    var b = s.bld[id]; if (!b) return;
    b.on = U.clamp(b.on + delta, 0, b.n);
  }
  function research(s, id) {
    var t = TECH[id]; if (!t || !techAvailable(s, t) || !canPay(s, t.cost)) return false;
    pay(s, t.cost, '研究'); s.techs[id] = true; s.stats.at['tech_' + id] = s.t;
    if (t.setFlag) s.flags[t.setFlag] = true;
    if (t.log) addLog(s, t.log, 'story');
    return true;
  }
  function buyUpg(s, id) {
    var u = UPG[id]; if (!u || !upgVisible(s, u) || !canPay(s, u.cost)) return false;
    pay(s, u.cost, '改善'); s.upg[id] = true; return true;
  }
  function setJob(s, id, delta) {
    var j = JOB[id]; if (!j || !jobVisible(s, j)) return;
    if (delta > 0) delta = Math.min(delta, idle(s));
    if (delta < 0) delta = Math.max(delta, -s.jobs[id]);
    s.jobs[id] += delta;
  }
  function train(s, id) {
    var L = LIC[id]; if (!L || !cond(s, L.unlock)) return false;
    if (idle(s) < 1 || !canPay(s, L.cost)) return false;
    pay(s, L.cost, '講習'); s.training.push({ lic: id, remain: L.time });
    return true;
  }
  function acceptOffer(s, oid) {
    var K = s.contracts;
    for (var i = 0; i < K.offers.length; i++) if (K.offers[i].id === oid) {
      var o = K.offers.splice(i, 1)[0];
      var tpl = tplById(o.tpl);
      var c = { id: o.id, tpl: o.tpl, scale: o.scale, step: 0, prog: 0 };
      K.active.push(c);
      addLog(s, '受託「' + tpl.name + '」のヒアリングを始めた。', 'dim');
      return true;
    }
    return false;
  }
  function declineOffer(s, oid) {
    var K = s.contracts; K.offers = K.offers.filter(function (o) { return o.id !== oid; });
  }

  /* ================= オフライン進行 ================= */
  function simulateAway(s, sec, onDone) {
    var full = Math.min(sec, C.offlineFull);
    var half = Math.max(0, Math.min(sec, C.offlineHalf) - C.offlineFull) * C.offlineHalfRate;
    var total = full + half;
    var before = U.deepCopy(s.res);
    var dtStep = Math.max(1, Math.min(15, total / 6000));
    var t = 0;
    while (t < total) { var dd = Math.min(dtStep, total - t); step(s, dd); t += dd; }
    s.stats.offline += total;
    return { away: sec, simulated: total, before: before };
  }

  /* ================= セーブ ================= */
  var KEY = 'taiki-minigame-save';
  function serialize(s) {
    var copy = {}; for (var k in s) if (k !== '_d') copy[k] = s[k];
    copy.saved = Date.now();
    return JSON.stringify(copy);
  }
  function save(s) {
    try { s.saved = Date.now(); localStorage.setItem(KEY, serialize(s)); return true; } catch (e) { return false; }
  }
  function load() {
    try { var raw = localStorage.getItem(KEY); if (!raw) return null; return migrate(JSON.parse(raw)); } catch (e) { return null; }
  }
  function migrate(o) {
    var s = newState();
    for (var k in o) {
      if (typeof o[k] === 'object' && o[k] !== null && !Array.isArray(o[k]) && s[k] && typeof s[k] === 'object' && !Array.isArray(s[k])) {
        for (var k2 in o[k]) s[k][k2] = o[k][k2];
      } else s[k] = o[k];
    }
    /* データに新しく増えた項目を補う */
    D.resources.forEach(function (r) { if (s.res[r.id] === undefined) s.res[r.id] = 0; });
    D.buildings.forEach(function (b) { if (!s.bld[b.id]) s.bld[b.id] = { n: 0, on: 0 }; });
    D.jobs.forEach(function (j) { if (s.jobs[j.id] === undefined) s.jobs[j.id] = 0; });
    D.licenses.forEach(function (l) { if (s.lic[l.id] === undefined) s.lic[l.id] = 0; });
    s.v = D.version;
    return s;
  }
  function exportText(s) { return btoa(unescape(encodeURIComponent(serialize(s)))); }
  function importText(txt) { return migrate(JSON.parse(decodeURIComponent(escape(atob(txt.trim()))))); }
  function wipe() { try { localStorage.removeItem(KEY); } catch (e) { /* 無視 */ } }

  return {
    init: init, newState: newState, step: step, derive: derive, cond: cond, cost: cost, canPay: canPay,
    actions: actions, doAction: doAction, build: build, sell: sell, setOn: setOn, research: research, buyUpg: buyUpg,
    setJob: setJob, train: train, acceptOffer: acceptOffer, declineOffer: declineOffer, claimEvent: claimEvent,
    resName: resName, bldVisible: bldVisible, techAvailable: techAvailable, upgVisible: upgVisible, jobVisible: jobVisible,
    idle: idle, assigned: assigned, lineCap: lineCap, mods: mods, priceOf: priceOf, demandOf: demandOf, tplById: tplById,
    simulateAway: simulateAway, save: save, load: load, exportText: exportText, importText: importText, wipe: wipe,
    addLog: addLog, KEY: KEY,
    get RES() { return RES; }, get BLD() { return BLD; }, get JOB() { return JOB; }, get TECH() { return TECH; },
    get UPG() { return UPG; }, get LIC() { return LIC; }, get PROD() { return PROD; }
  };
})();

    ['lab', 1], ['i_refract', 1], ['rlab', 2], ['fork', 2], ['truck2', 2], ['canwasher', 1], ['coag', 1], ['filler', 2], ['line', 1], ['boiler', 1], ['conc', 1], ['truck4', 1], ['drum', 1], ['crane', 1], ['substation', 1], ['rlab', 4],
    ['shiptank', 1], ['dike', 1], ['loader', 1], ['tscale', 1], ['lorry', 2], ['acidtank', 1], ['bigreactor', 2], ['bigchlor', 1], ['rnd', 2], ['lab2', 1],

    ['ureabuy', 1], ['ureadis', 1], ['upwplant', 1], ['i_icp', 1], ['bibline', 1], ['office', 1], ['canline', 1], ['i_ftir', 1], ['lorry', 4], ['depot', 1], ['lorry20', 2], ['rnd', 4],
    ['newplant', 1], ['autowh', 1], ['h2rec', 3], ['msscrub', 2], ['wreuse', 5], ['curefine', 4], ['farm', 3], ['megareactor', 2], ['ureasyn', 1], ['rnd2', 2], ['upwplant2', 1], ['hpline', 1], ['port', 1], ['canline', 3],
    ['fuelplant', 2], ['electrolysis', 2], ['launch', 2], ['fusionpower', 1], ['spacelab', 1], ['moonplant', 2], ['orbtank', 1], ['spacewater', 3], ['venus', 2], ['orbreactor', 2], ['spacewater', 6], ['moonplant', 4], ['orbreactor', 4], ['venus', 4], ['asteroid', 1], ['asteroidreactor', 1], ['spacewater', 10],
    ['starfurnace', 2], ['starlab', 1], ['ismnet', 1], ['alien', 1], ['galwater', 1], ['starlorry', 1]];

  function botIntro(s) {
    var A = E.actions;

  function think(s) {

    if (E.actions.buyacid.vis(s) && s.res.hcl < 4 && E.actions.buyacid.ok(s) && !(s.bld.acidbuy && s.bld.acidbuy.n)) E.doAction(s, 'buyacid');
    if (E.actions.buycans.vis(s) && s.res.can < 3 && E.actions.buycans.ok(s)) E.doAction(s, 'buycans');
    if (s.evActive) E.claimEvent(s);
    if (s.era === 1) {
      for (var c = 0; c < 4; c++) if (s.res.scrap < d.cap.scrap - 1) E.doAction(s, 'pick');
      if (E.actions.sink.ok(s) && s.res.fecl2 < d.cap.fecl2 - 3) E.doAction(s, 'sink');
    }

    /* 研究：安いものから */
    var techs = D.techs.filter(function (t) { return E.techAvailable(s, t); }).sort(function (a, b) { return a.cost.research - b.cost.research; });
    techs.forEach(function (t) { E.research(s, t.id); });

    /* 大型設備：解放されていれば最優先で貯める */
    var mega = null;
    D.buildings.forEach(function (b) { if (b.stages && E.bldVisible(s, b) && s.bld[b.id].n < b.stages && (!b.buildCond || E.cond(s, b.buildCond))) mega = b; });
    var reserve = 0;
    /* 住む場所が足りなければ先に */
    var salNow = s.pop * TM.DATA.consts.salary * (TM.DATA.eraSalary[s.era] || 1);
    if (s.pop >= d.popCap - 1 && (s.pop < 6 || (s.incAvg || 0) > salNow * 2 + 0.3)) {
      ['house', 'office', 'newplant'].forEach(function (id) { if (E.bldVisible(s, E.BLD[id])) E.build(s, id); });
      d = E.derive(s);
    }
    /* 止まっている工程を見て、足りないものを補う（プレイヤーが工程図を見て直すのと同じ） */
    fixBottlenecks(s, E.derive(s));
    d = E.derive(s);
    /* 要になる設備（目標数まで優先して買う） */
    for (var ki = 0; ki < KEY.length; ki++) {
      var kb = E.BLD[KEY[ki][0]];
      if (!kb || !E.bldVisible(s, kb) || s.bld[kb.id].n >= KEY[ki][1]) continue;
      if (kb.max && s.bld[kb.id].n >= kb.max) continue;
      if (E.build(s, kb.id)) { ki = -1; continue; }
      var kc = E.cost(s, kb);
      var ok = true; for (var rk in kc) if (rk !== 'money' && (s.res[rk] || 0) < kc[rk]) ok = false;
      if (ok && (kc.money || 0) <= Math.max(50, s.res.money) * 4) { reserve = kc.money || 0; break; }
    }
    if (mega) {
      E.build(s, mega.id);
      var mc = E.cost(s, mega).money || 0;
      if (s.bld[mega.id].n < mega.stages && mc < Math.max(1, s.res.money) * 8) reserve = Math.max(reserve, mc * 0.6);
    }
    var spend = Math.max(0, s.res.money - reserve);

    /* 資格 */
    var want = { geki: 1, fork: s.bld.fork.n, jmid: s.bld.truck2.n, mid: s.bld.truck4.n, big: s.bld.lorry.n + s.bld.lorry20.n, crane: s.bld.crane.n ? 1 : 0 };
    D.licenses.forEach(function (L) {
      var have = s.lic[L.id] + s.training.filter(function (t) { return t.lic === L.id; }).length;
      if (have < (want[L.id] || 0) && spend > L.cost.money * 2) {
        if (E.idle(s) < 1) { for (var jk in s.jobs) if (s.jobs[jk] > 0 && jk !== 'operate') { s.jobs[jk]--; break; } }
        E.train(s, L.id);
      }
    });

    /* 改善 */
    D.upgrades.filter(function (u) { return E.upgVisible(s, u); }).sort(function (a, b) { return (a.cost.money || 0) - (b.cost.money || 0); })
      .forEach(function (u) { if ((u.cost.money || 0) <= spend * 0.6 && E.canPay(s, u.cost)) { E.buyUpg(s, u.id); spend = Math.max(0, s.res.money - reserve); } });

    /* 設備：役に立ちそうなものを安い順に */
    var cands = D.buildings.filter(function (b) { return !b.stages && E.bldVisible(s, b) && useful(s, d, b); });
    /* 高いもの（効き目が大きいもの）から、手持ちの半分以内で */
    cands.sort(function (a, b) { return (E.cost(s, a).money || 0) - (E.cost(s, b).money || 0); });
    for (var i = 0; i < 25; i++) {
      var bought = false;
      for (var j = 0; j < cands.length; j++) {
        var b = cands[j], c = E.cost(s, b);
        if ((c.money || 0) > Math.max(spend * 0.6, s.res.money * 0.12)) continue;
        if (E.build(s, b.id)) { bought = true; spend = Math.max(0, s.res.money - reserve); d = E.derive(s); break; }
      }
      if (!bought) break;
    }
    /* 全部稼働 */
    D.buildings.forEach(function (b) {
      if (!b.proc || !b.proc.toggle) return;
      var on = s.bld[b.id].n, out = b.proc.out || {};
      /* 作りすぎない・お金が尽きない程度に */
      for (var k in out) if (k !== 'waste' && d.cap[k] !== Infinity && s.res[k] > d.cap[k] * 0.9) on = Math.min(on, Math.ceil(s.bld[b.id].n * 0.3));
      if (b.proc.in && b.proc.in.money && s.res.money < b.proc.in.money * 60) on = Math.floor(on / 2);
      s.bld[b.id].on = on;
    });
    /* 受託 */
    while (s.contracts.offers.length && s.contracts.active.filter(function (c) { return c.step < TM.DATA.contracts.steps.length; }).length < (s.jobs.sales || 0) + 1) E.acceptOffer(s, s.contracts.offers[0].id);
    assignJobs(s, E.derive(s));
  }

  function fixBottlenecks(s, d) {
    var D = TM.DATA, need = {}, power = false, room = {};
    (d.procs || []).forEach(function (p) {
      if (!p.reason) return;
      if (p.reason.indexOf('入力不足') === 0) for (var k in p.inp) if (p.inp[k] > 0 && s.res[k] < p.inp[k] * 5 && k !== 'money') need[k] = (need[k] || 0) + 1;
      if (p.reason === '電力不足') power = true;
      if (p.reason.indexOf('置き場が満杯') === 0) for (var k2 in p.out) if (p.out[k2] > 0 && d.cap[k2] !== Infinity && s.res[k2] >= d.cap[k2] * 0.98 && k2 !== 'waste') room[k2] = 1;
    });
    if (d.powerEff < 0.99) power = true;
    var tries = [];
    D.buildings.forEach(function (b) {
      if (b.stages || !E.bldVisible(s, b) || (b.max && s.bld[b.id].n >= b.max)) return;
      var sc = 0;
      if (b.proc && b.proc.out) for (var k in b.proc.out) if (need[k]) sc += need[k] * 2;
      if (power && b.effects && b.effects.power) sc += 3;
      if (b.effects && b.effects.cap) for (var k3 in b.effects.cap) if (room[k3]) sc += 1;
      if (sc > 0) tries.push([sc, b]);
    });
    tries.sort(function (a, b) { return b[0] - a[0] || (E.cost(s, a[1]).money || 0) - (E.cost(s, b[1]).money || 0); });
    var bought = 0;
    for (var i = 0; i < tries.length && bought < 4; i++) {
      var c = E.cost(s, tries[i][1]);
      if ((c.money || 0) > s.res.money * 0.5) continue;
      if (E.build(s, tries[i][1].id)) bought++;
    }
  }

  function nearCap(s, d, ids, f) {
    for (var i = 0; i < ids.length; i++) if (d.cap[ids[i]] !== Infinity && s.res[ids[i]] >= d.cap[ids[i]] * (f || 0.7)) return true;
    return false;
  }

  function useful(s, d, b) {
    var n = s.bld[b.id].n, e = b.effects || {};
    if (b.max && n >= b.max) return false;
    /* お金を食う設備は、収支に余裕があるときだけ増やす */
    if (b.proc && b.proc.in && b.proc.in.money && s.era >= 2) {
      var net = d.rate ? d.rate.money || 0 : 0;
      if (net < b.proc.in.money * (d.glob || 1) * 3) return false;
    }
    switch (b.id) {
      case 'land': return d.used > d.land * 0.75;
      case 'house': case 'office': return s.pop >= d.popCap - 1 && (s.pop < 6 || (s.incAvg || 0) > s.pop * 0.03 + 0.3);
      case 'shed': return nearCap(s, d, ['hcl']) || (nearCap(s, d, ['scrap']) && s.res.hcl > 10);
      case 'desk': case 'study': {
        var maxT = 0; TM.DATA.techs.forEach(function (t) { if (E.techAvailable(s, t) || (!s.techs[t.id] && (t.era || 0) <= s.era)) maxT = Math.max(maxT, t.cost.research); });
        return d.cap.research < maxT * 1.3 || nearCap(s, d, ['research'], 0.8) || b.id === 'study';
      }
      case 'canyard': case 'pallet': case 'rack': return nearCap(s, d, ['can', 'dcan', 'p_fecl2', 'p_fecl3', 'p_hcl', 'p_fecl3h', 'p_uw', 'p_naclo']);
      case 'canbuy': return n < 3 + s.era * 2 && s.res.can < d.cap.can * 0.5;
      case 'scrapbuy': return n < 6 && s.res.scrap < d.cap.scrap * 0.5;
      case 'acidbuy': return n < 6 && s.res.hcl < d.cap.hcl * 0.5;
      case 'powerc': case 'substation': return d.powerDem > d.powerSup * 0.8;
      case 'vent': case 'scrubber': return d.ventEff < 1 || (b.id === 'scrubber' && n < 2);
      case 'kama': return n < 8;
      case 'kei': return n < 4;
      case 'dike': case 'loader': case 'tscale': return n < 1;
      case 'neutral': case 'coag': return s.res.waste > d.cap.waste * 0.4 || n === 0;
      case 'boiler': return n < 1 + (s.bld.conc.n + s.bld.ureadis.n) / 2;
      case 'fork': return n < 6 + s.era * 2;
      case 'h2tank': return nearCap(s, d, ['h2']);
      case 'orbtank': case 'starstore': return true;
      case 'farm': return n < 3;
      case 'newplant': return d.used > d.land * 0.7 || s.pop >= d.popCap - 2;
      default: return true;
    }
  }

  function assignJobs(s, d) {
    var D = TM.DATA, m = d.m, P = s.pop - s.training.length;
    var vis = {}; D.jobs.forEach(function (j) { vis[j.id] = E.jobVisible(s, j); });
    var res = {}; D.jobs.forEach(function (j) { res[j.id] = 0; });
    var left = P;
    function fix(k, n) { if (!vis[k]) return; n = Math.max(0, Math.min(left, n)); res[k] += n; left -= n; }
    /* 先に決まった人数が要る配属 */
    var opNeed = 0;
    if (!(m['auto.operate'] > 0)) D.buildings.forEach(function (b) { if (b.proc && b.proc.operator === 'operate') opNeed += s.bld[b.id].on; });
    fix('operate', Math.min(opNeed, Math.floor(P * 0.45)));
    if (vis.fill) fix('fill', 1);
    if (vis.deliver) fix('deliver', 1);
    if (vis.research) fix('research', 1);
    var veh = 0; d.vehicles.forEach(function (v) { veh += v.n; });
    if (!m['auto.drive']) fix('deliver', veh);
    if (!m['auto.line']) fix('fill', s.bld.line.n * 2 + s.bld.filler.n);
    if (!m['auto.fork']) fix('handle', Math.min(s.bld.fork.n, s.lic.fork));
    fix('sales', Math.min(6, s.contracts.active.filter(function (c) { return c.step < D.contracts.steps.length; }).length));
    /* 残りを比率で */
    var buyScrap = s.bld.scrapbuy.n > 0 || s.bld.scrapyard.n > 0;
    var w = {};
    if (s.era <= 1) w = { dissolve: 3, gather: buyScrap && s.res.scrap > d.cap.scrap * 0.3 ? 0.3 : 2.5, fill: 1.5, deliver: 1, research: 1.8, wash: s.res.dcan > 3 ? 0.7 : 0, check: s.res.fecl3w > 1 ? 1 : 0 };
    else if (s.era === 2) w = { dissolve: 1, gather: buyScrap ? 0.2 : 1, fill: 1, deliver: 0.6, research: 2.5, wash: s.res.dcan > 5 ? 0.6 : 0, check: s.res.fecl3w > 5 ? 1.2 : 0.2, handle: d.handEff < 0.95 ? 1.2 : 0.3 };
    else w = { research: 5, check: s.res.fecl3w > d.cap.fecl3w * 0.3 ? 1.5 : 0.3, handle: d.handEff < 0.95 ? 1 : 0.1, fill: 0.3, dissolve: 0.3 };
    var ws = 0, k;
    for (k in w) { if (!vis[k]) w[k] = 0; if (k === 'dissolve') w[k] = Math.min(w[k], (d.slots.dissolve || 0) - res.dissolve > 0 ? w[k] : 0); ws += w[k]; }
    var pool = left, rem = [];
    for (k in w) {
      if (!ws || !w[k]) continue;
      var x = pool * w[k] / ws, n = Math.floor(x);
      if (k === 'dissolve') n = Math.min(n, Math.max(0, (d.slots.dissolve || 0) - res.dissolve));
      fix(k, n); rem.push([k, x - n]);
    }
    rem.sort(function (a, b) { return b[1] - a[1]; });
    rem.forEach(function (r) { if (left > 0 && r[1] > 0.2) fix(r[0], 1); });
    /* 余りは研究（なければ回収） */
    if (vis.research) fix('research', left); else fix('gather', left);
    if (left > 0 && vis.dissolve) fix('dissolve', Math.min(left, (d.slots.dissolve || 0) - res.dissolve));
    if (left > 0) res.gather += left;
    for (k in res) s.jobs[k] = res[k];
  }

  /* 1日の中で遊んでいる時間帯か */
  function inSession(style, tDay, firstDay) {
    var h = tDay / 3600;
    for (var i = 0; i < style.sessions.length; i++) {
      var st = style.sessions[i][0], len = (firstDay && i === 0 ? Math.max(style.first || 0, style.sessions[i][1]) : style.sessions[i][1]) / 60;
      if (h >= st && h < st + len) return { end: (st + len) * 3600 };
    }
    return null;
  }
  function nextSession(style, tDay) {
    var h = tDay / 3600;
    for (var i = 0; i < style.sessions.length; i++) if (style.sessions[i][0] > h) return style.sessions[i][0] * 3600;
    return 86400 + style.sessions[0][0] * 3600;
  }

  /* 実行。maxDays 日まで、または完成まで */
  function run(styleId, maxDays, opts) {
    opts = opts || {};
    E.init && E.init();
    var style = STYLES[styleId];
    var s = opts.state || E.newState();
    var real = opts.real || style.sessions[0][0] * 3600; /* 1日目の最初の時間帯から始める */
    var milestones = {}, lastEra = -1;
    function mark(k) { if (milestones[k] === undefined) milestones[k] = (real - style.sessions[0][0] * 3600); }
    var guard = 0;
    while (real < maxDays * 86400 + style.sessions[0][0] * 3600 && !s.ending) {
      if (++guard > 5e6) break;
      var tDay = real % 86400;
      var sess = inSession(style, tDay, real < 86400);
      if (sess) {
        var end = real - tDay + sess.end, nextThink = 0;
        while (real < end && !s.ending) {
          var dt = s.era === 0 ? 0.5 : 1;
          if (s.era === 0) botIntro(s);
          else if (real >= nextThink) { think(s); nextThink = real + style.think; }
          E.step(s, dt); real += dt;
          if (s.era !== lastEra) { lastEra = s.era; mark('era' + s.era); }
          if (s.flags.hook) mark('hook');
        }
      } else {
        var nxt = real - tDay + nextSession(style, tDay);
        var away = nxt - real;
        E.simulateAway(s, away);
        real = nxt;
        if (s.era !== lastEra) { lastEra = s.era; mark('era' + s.era); }
        if (opts.onProgress) opts.onProgress(real, s);
        if (opts.stopAtEra !== undefined && s.era >= opts.stopAtEra) break;
      }
    }
    if (s.ending) mark('ending');
    if (opts.stopAtEra !== undefined) milestones._real = real;
    return { style: style.name, milestones: milestones, state: s, realDays: (real - style.sessions[0][0] * 3600) / 86400 };
  }

  return { run: run, STYLES: STYLES, think: think, botIntro: botIntro };
})();

<script>
/* 画面の描画。状態(TM.state)を読み、操作はエンジンの関数を呼ぶ */
var TM = window.TM = window.TM || {};

TM.UI = (function () {
  var E = TM.Engine, U = TM.util, D, el = U.el;
  var tab = 'site', lastSig = {}, refs = {}, seenTabs = {};
  var $ = function (id) { return document.getElementById(id); };

  function S() { return TM.state; }
  function f(n) { return U.fmt(n, S().settings.expo); }
  function fr(r) { return U.fmtRate(r, S().settings.expo); }

  function init() {
    D = TM.DATA;
    /* クリックはまとめて受ける（描き直しでボタンが入れ替わっても取りこぼさない） */
    document.body.addEventListener('click', onClick);
    $('gear').addEventListener('click', openSettings);
    try { tab = localStorage.getItem('taiki-minigame-tab') || 'site'; } catch (e) { /* 無視 */ }
  }

  function onClick(e) {
    var t = e.target.closest('[data-a]'); if (!t) return;
    var a = t.getAttribute('data-a'), id = t.getAttribute('data-id'), v = +t.getAttribute('data-v') || 0;
    var s = S();
    switch (a) {
      case 'act': E.doAction(s, id); break;
      case 'build': E.build(s, id); break;
      case 'sell': if (confirm('1つ解体しますか？（費用の半分が戻ります）')) E.sell(s, id); break;
      case 'on': E.setOn(s, id, v); break;
      case 'job': E.setJob(s, id, v); break;
      case 'train': E.train(s, id); break;
      case 'tech': E.research(s, id); break;
      case 'upg': E.buyUpg(s, id); break;
      case 'tab': tab = id; try { localStorage.setItem('taiki-minigame-tab', tab); } catch (e2) { /* 無視 */ } lastSig.panel = null; break;
      case 'accept': E.acceptOffer(s, +id); break;
      case 'decline': E.declineOffer(s, +id); break;
      case 'event': E.claimEvent(s); break;
      case 'close': closeModal(); break;
      default: if (TM.UIActions && TM.UIActions[a]) TM.UIActions[a](t, id, v);
    }
    render(true);
  }

  /* ============ 全体 ============ */
  function render(force) {
    var s = S(); if (!s) return;
    var d = s._d || E.derive(s);
    document.body.setAttribute('data-era', s.era);
    document.body.classList.toggle('intro', s.era === 0);
    document.body.classList.toggle('noanim', !s.settings.anim);
    document.body.classList.toggle('hasresources', s.era === 0 && !!s.flags.picked);
    renderTitle(s);
    renderTop(s, d);
    renderLog(s);
    renderResources(s, d);
    renderActions(s, d);
    renderTabs(s);
    renderPanel(s, d, force);
    if (s.ending && TM.UIEnding) TM.UIEnding(s);
  }

  function renderTitle(s) {
    var m = $('mini');
    var want = s.era >= 6 && s.settings.gag !== false ? 'gone' : s.era >= 5 && s.settings.gag !== false ? 'strike' : 'plain';
    if (m.getAttribute('data-st') === want) return;
    m.setAttribute('data-st', want);
    m.innerHTML = want === 'gone' ? '' : want === 'strike' ? '<s>ミニ</s>' : 'ミニ';
  }

  function renderTop(s, d) {
    var C = D.consts;
    var memo = '';
    if (s.flags.memo) {
      var open = [];
      for (var i = 0; i < D.memos.length && open.length < 3; i++) if (!E.cond(s, D.memos[i].done)) open.push(D.memos[i].text);
      if (open.length) memo = '<b>作業メモ</b>' + open[0] + (open[1] ? '<span class="dim">　／　' + open[1] + '</span>' : '');
      if (!memo) memo = '<b>作業メモ</b>……';
    }
    setHTML($('memo'), memo);
    var year = Math.floor(s.t / (C.seasonSec * 4)) + 1, season = D.seasons[Math.floor(s.t / C.seasonSec) % 4];
    setHTML($('cal'), s.era >= 1 ? year + '年目　' + season : '');
  }

  function renderLog(s) {
    var sig = s.log.length + ':' + (s.log[0] ? s.log[0].t + s.log[0].text : '');
    if (sig !== lastSig.log) {
      lastSig.log = sig;
      var box = $('log'); box.innerHTML = '';
      s.log.slice(0, 40).forEach(function (l, i) { box.appendChild(el('div', { class: (l.cls || '') + (i === 0 ? ' fade' : ''), text: l.text })); });
    }
    var ev = $('event'), evSig = s.evActive ? s.evActive.id : '';
    if (evSig !== lastSig.ev) {
      lastSig.ev = evSig; ev.innerHTML = '';
      if (s.evActive) {
        var e = null; D.events.forEach(function (x) { if (x.id === s.evActive.id) e = x; });
        if (e) ev.appendChild(el('div', { class: 'ev fade' }, [e.text, el('br'), el('button', { class: 'btn', 'data-a': 'event', text: e.button })]));
      }
    }
  }

  /* ============ 資源 ============ */
  function renderResources(s, d) {
    var rows = [];
    D.resources.forEach(function (r) {
      if (!s.flags['r_' + r.id]) return;
      if (r.id === 'research' && !s.flags.research_known) return;
      rows.push(r.id);
    });
    var extra = [];
    if (s.pop > 0) extra.push('pop');
    if (s.era >= 1) extra.push('land');
    if (s.flags.power_known) extra.push('power');
    if (s.era >= 2 || s.flags.handling_short) extra.push('handling');
    if (s.flags.smoke) extra.push('vent');
    if (s.era >= 4) extra.push('circ');
    if (s.res.money < 0 || s.flags.oncredit) extra.push('creditline');
    var sig = rows.join(',') + '|' + extra.join(',');
    var box = $('resources');
    if (sig !== lastSig.res) {
      lastSig.res = sig; box.innerHTML = ''; refs.res = {};
      rows.forEach(function (id) {
        var nm = el('span', { class: 'nm' }), v = el('span', { class: 'v' }), r = el('span', { class: 'r' });
        var row = el('div', { class: 'res fade' }, [nm, v, r]);
        refs.res[id] = { row: row, nm: nm, v: v, r: r };
        box.appendChild(row);
      });

  /* ============ 共通部品 ============ */
  function costText(s, c, plain) {
    var parts = [];
    for (var k in c) {
      var nm = k === 'money' ? '円' : E.resName(s, k);
      var lack = (s.res[k] || 0) < c[k];
      var t = k === 'money' ? f(c[k]) + '円' : nm + ' ' + f(c[k]);
      parts.push(plain ? t : '<span class="' + (lack ? 'lack' : '') + '">' + t + '</span>');
    }
    return parts.join('　');
  }
  function timeTo(s, d, c) {
    var worst = 0;
    for (var k in c) {
      var need = c[k] - (s.res[k] || 0);
      if (need <= 0) continue;
      var r = d.rate ? d.rate[k] : 0;
      if (!(r > 0)) return Infinity;
      if (d.cap[k] !== Infinity && d.cap[k] < c[k]) return -1;
      worst = Math.max(worst, need / r);
    }
    return worst;
  }
  function setText(e, t) { if (e && e.textContent !== t) e.textContent = t; }
  function setHTML(e, h) { if (e && e.innerHTML !== h) e.innerHTML = h; }

      if (done.length) box.appendChild(el('div', { class: 'group' }, [el('h3', { text: '済んだ改善' }), el('div', { class: 'dim', style: 'font-size:12px', text: done.map(function (u) { return u.name; }).join('、') })]));
    }, function (R) {

  PANELS.market = function (s, d, box) {

    }, function (R) {

        (zi.bulkZone >= 0 ? '　ローリー：' + D.zones[zi.bulkZone].name + '（' + fr(zi.bulkRate * (d.glob || 1)).replace('+', '') + 'kg）' : '') +

  PANELS.flow = function (s, d, box) {

  PANELS.line = function (s, d, box) {

  PANELS.fin = function (s, d, box) {
    var sig = 'fin|' + s.fin.hist.length + '|' + (s.fin.hist[0] ? s.fin.hist[0].total.inc : 0);
    keyed(box, sig, function (R) {
      box.appendChild(el('p', { class: 'note', text: '月ごとの損益（ゲーム内の1か月 ≒ 約7分）。' }));

        box.appendChild(tb);

    }, function (R) {
