      setHTML(R.cur, '今月（' + Math.round(s.fin.monthT / D.consts.monthSec * 100) + '%経過）　収入 ' + f(inc) + '　支出 ' + f(exp) + '　<span class="' + (inc - exp >= 0 ? 'good' : 'bad') + '">' + (inc - exp >= 0 ? '+' : '') + f(inc - exp) + '</span>');
      if (R.circ) {
        var h = '<b style="font-weight:normal">循環率 ' + Math.round(d.circ * 100) + '%</b>（高いほど、すべての生産と単価が上がる）<br>';
        D.circ.forEach(function (c) { var v = Math.min(1, (d.circParts[c.id] || 0) / c.need); h += '<span class="' + (v >= 1 ? 'good' : 'dim') + '">' + c.name + ' ' + Math.round(v * 100) + '%</span>　'; });
        setHTML(R.circ, h);
      }
    });
  };

  PANELS.oem = function (s, d, box) {
    var K = s.contracts, steps = D.contracts.steps;
    var sig = 'oem|' + K.offers.map(function (o) { return o.id; }).join(',') + '|' + K.active.map(function (c) { return c.id + ':' + c.step; }).join(',');
    keyed(box, sig, function (R) {
      box.appendChild(el('p', { class: 'note', text: '他社の「困った」を引き受ける。営業1人で1件ずつ進み、製品化すると毎秒の収入になる（原料などを少し使う）。' }));
      R.head = el('p'); box.appendChild(R.head);
      var g = el('div', { class: 'group' }, [el('h3', { text: '引き合い' })]);
      if (!K.offers.length) g.appendChild(el('p', { class: 'note', text: '今は引き合いがない。' }));
      K.offers.forEach(function (o) {
        var t = E.tplById(o.tpl);
        g.appendChild(el('div', { class: 'card fade' }, [el('div', { text: t.name }), el('small', { class: 'dim', text: '見込み：' + f(t.income * o.scale) + '円/秒' }), el('div', { style: 'margin-top:6px' }, [
          el('button', { class: 'mini', 'data-a': 'accept', 'data-id': o.id, text: '引き受ける' }), el('button', { class: 'mini', 'data-a': 'decline', 'data-id': o.id, text: '断る' })])]));
      });
      box.appendChild(g);
      var g2 = el('div', { class: 'group' }, [el('h3', { text: '進行中・継続中' })]);
      K.active.forEach(function (c) {
        var t = E.tplById(c.tpl), stp = el('div', { class: 'steps' });
        steps.forEach(function (x, i) { stp.appendChild(el('span', { class: i < c.step ? 'done' : i === c.step ? 'cur' : '', title: x.name })); });
        var st = el('small', { class: 'dim' });
        g2.appendChild(el('div', { class: 'card' }, [el('div', { text: t.name }), stp, st]));
        R['c' + c.id] = { st: st, c: c };
      });
      box.appendChild(g2);
    }, function (R) {
      setText(R.head, '営業 ' + (s.jobs.sales || 0) + '人　製品化 ' + K.done + '件');
      K.active.forEach(function (c) {
        var r = R['c' + c.id]; if (!r) return;
        var t = E.tplById(c.tpl);
        if (c.step >= steps.length) setText(r.st, '継続受託中：' + f(t.income * c.scale * (d.glob || 1) * (c.eff === undefined ? 1 : c.eff)) + '円/秒' + (c.eff < 0.99 ? '（原料不足）' : ''));
        else setText(r.st, steps[c.step].name + '　' + Math.floor(c.prog / steps[c.step].sec * 100) + '%' + (c.waiting ? '　' + c.waiting : ''));
      });
    });
  };

  PANELS.stats = function (s, d, box) {
    var sig = 'stats|' + Math.floor(s.t / 5);
    keyed(box, sig, function () {
      var st = s.stats, rows = [];
      rows.push(['遊び始めてから', U.fmtTime((Date.now() - s.started) / 1000)]);
      rows.push(['ゲームの中の時間', U.fmtTime(s.t)]);
      rows.push(['留守中に進んだ時間', U.fmtTime(st.offline)]);
      rows.push(['稼いだお金', f(st.earned) + '円']);
      rows.push(['売った缶', f(st.cansSold) + '缶']);
      rows.push(['洗った缶', f(st.washed) + '缶']);
      rows.push(['逃がした水素', f(st.h2) + 'kg']);
      rows.push(['手を動かした回数', f(st.clicks) + '回']);
      var tb = el('table', { class: 't' });
      rows.forEach(function (r) { tb.appendChild(el('tr', {}, [el('td', { text: r[0] }), el('td', { text: r[1] })])); });
      box.appendChild(tb);
      var pr = el('table', { class: 't', style: 'margin-top:14px' });
      pr.appendChild(el('tr', {}, [el('th', { text: 'これまでにつくったもの' }), el('th', { text: '' })]));
      Object.keys(st.produced).forEach(function (k) { if (E.RES[k] && k !== 'money' && st.produced[k] > 0) pr.appendChild(el('tr', {}, [el('td', { text: E.resName(s, k) }), el('td', { text: f(st.produced[k]) + ' ' + E.RES[k].unit })])); });
      box.appendChild(pr);
    }, function () {});
  };

  /* ============ 設定 ============ */
  function openModal(html, onMount) {
    var m = $('modal'), b = $('modalbox');
    b.innerHTML = html; m.classList.remove('hidden');
    if (onMount) onMount(b);
  }
  function closeModal() { $('modal').classList.add('hidden'); }

  function openSettings() {
    var s = S();
    openModal('<h2>設定</h2>' +
      '<div class="sect"><label><input type="checkbox" id="o_expo" ' + (s.settings.expo ? 'checked' : '') + '> 大きな数を指数で表示（1.2e45）</label>' +
      '<label><input type="checkbox" id="o_anim" ' + (s.settings.anim ? 'checked' : '') + '> 表示のふわっとした動き</label>' +
      '<label><input type="checkbox" id="o_gag" ' + (s.settings.gag !== false ? 'checked' : '') + '> タイトルの小ネタ</label></div>' +
      '<div class="sect"><b style="font-weight:normal">セーブの書き出し（別のPC・ブラウザへ引っ越すとき）</b><textarea id="o_exp" readonly></textarea>' +
      '<button class="mini" id="o_copy">コピー</button></div>' +
      '<div class="sect"><b style="font-weight:normal">セーブの読み込み</b><textarea id="o_imp" placeholder="ここに書き出した文字を貼り付け"></textarea><button class="mini" id="o_load">読み込む</button></div>' +
      '<div class="sect"><button class="mini" id="o_wipe">最初からやり直す</button>　<button class="mini" id="o_dev">開発者モード</button></div>' +
      '<div class="sect" style="text-align:right"><button class="btn" data-a="close">閉じる</button></div>',
    function (b) {
      b.querySelector('#o_exp').value = E.exportText(s);
      b.querySelector('#o_expo').onchange = function (e) { s.settings.expo = e.target.checked; lastSig = {}; };
      b.querySelector('#o_anim').onchange = function (e) { s.settings.anim = e.target.checked; };
      b.querySelector('#o_gag').onchange = function (e) { s.settings.gag = e.target.checked; };
      b.querySelector('#o_copy').onclick = function () { var t = b.querySelector('#o_exp'); t.select(); try { document.execCommand('copy'); } catch (e) { /* 無視 */ } };
      b.querySelector('#o_load').onclick = function () {
        try { var ns = E.importText(b.querySelector('#o_imp').value); TM.state = ns; E.save(ns); lastSig = {}; closeModal(); alert('読み込みました。'); }
        catch (e) { alert('読み込めませんでした。文字が欠けていないか確かめてください。'); }
      };
      b.querySelector('#o_wipe').onclick = function () {
        if (!confirm('セーブを消して最初からやり直しますか？')) return;
        if (!confirm('本当に消しますか？（元に戻せません）')) return;
        E.wipe(); TM.state = E.newState(); lastSig = {}; closeModal();
      };
      b.querySelector('#o_dev').onclick = function () { if (TM.Dev) TM.Dev.ask(); };
    });
  }

  function resetSig() { lastSig = {}; }

  return { init: init, render: render, openModal: openModal, closeModal: closeModal, resetSig: resetSig, f: f };
})();

</script>
<script>
/* 開発者モード（パスワード 1234）。※画面上の簡易な鍵で、セキュリティのためのものではない */
var TM = window.TM = window.TM || {};

TM.Dev = (function () {
  var E = TM.Engine, U = TM.util;
  var PASS = '1234';
  var on = false;
  TM.speed = 1;
  TM.infMoney = false;

  function ask() {
    TM.UI.openModal('<h2>開発者モード</h2><p class="note">パスワードを入れてください。</p><input type="password" id="dv_pw" autocomplete="off"><div class="sect" style="text-align:right"><button class="mini" id="dv_ok">入る</button> <button class="mini" data-a="close">やめる</button></div>', function (b) {
      var inp = b.querySelector('#dv_pw'); inp.focus();
      function go() {
        if (inp.value === PASS) { TM.UI.closeModal(); enable(); }
        else { inp.value = ''; inp.placeholder = 'ちがいます'; }
      }
      b.querySelector('#dv_ok').onclick = go;
      inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    });
  }

  function enable() {
    on = true;
    try { sessionStorage.setItem('taiki-minigame-dev', '1'); } catch (e) { /* 無視 */ }
    draw();
  }
  function disable() {
    on = false; TM.speed = 1; TM.infMoney = false;
    try { sessionStorage.removeItem('taiki-minigame-dev'); } catch (e) { /* 無視 */ }
    document.getElementById('devpanel').classList.add('hidden');
  }

  function draw() {
    var p = document.getElementById('devpanel');
    p.classList.remove('hidden');
    var sp = [1, 10, 100, 1000, 10000].map(function (x) { return '<button data-dv="speed" data-v="' + x + '" class="' + (TM.speed === x ? 'on' : '') + '">×' + x + '</button>'; }).join('');
    p.innerHTML = '<h4>開発者モード</h4>' +
      '<div>速度 ' + sp + '</div>' +
      '<div><button data-dv="money" class="' + (TM.infMoney ? 'on' : '') + '">お金無限 ' + (TM.infMoney ? 'ON' : 'OFF') + '</button>' +
      '<button data-dv="fill">資源を満タン</button><button data-dv="research">技術+大量</button></div>' +
      '<div>時間を進める <button data-dv="skip" data-v="600">+10分</button><button data-dv="skip" data-v="3600">+1時間</button><button data-dv="skip" data-v="28800">+8時間</button></div>' +
      '<div><button data-dv="pop">人手+10</button><button data-dv="techs">技術を全部</button><button data-dv="era">次の時代へ</button><button data-dv="reveal">全部見せる</button></div>' +
      '<div>自動プレイで計測 <button data-dv="sim" data-v="heavy">ヘビー</button><button data-dv="sim" data-v="normal">ふつう</button><button data-dv="sim" data-v="light">ライト</button></div>' +
      '<div><button data-dv="dump">状態をコピー</button><button data-dv="off">終了</button></div>' +
      '<pre id="dv_out"></pre>';
  }

  function onClick(e) {
    var t = e.target.closest('[data-dv]'); if (!t || !on) return;
    var a = t.getAttribute('data-dv'), v = t.getAttribute('data-v');
    var s = TM.state, d = E.derive(s);
    var out = document.getElementById('dv_out');
    switch (a) {
      case 'speed': TM.speed = +v; break;
      case 'money': TM.infMoney = !TM.infMoney; break;
      case 'fill':
        for (var k in s.res) { if (d.cap[k] !== undefined && d.cap[k] !== Infinity) s.res[k] = d.cap[k]; }
        s.res.money = Math.max(s.res.money, 1e6 * Math.pow(100, s.era));
        break;
      case 'research': s.res.research += Math.max(1000, (s.res.research || 0)) * 100; if (d.cap.research !== Infinity) s.res.research = Math.max(s.res.research, 0); break;
      case 'skip': out.textContent = '計算中…'; setTimeout(function () { var r = E.simulateAway(s, +v); document.getElementById('dv_out').textContent = U.fmtTime(r.simulated) + ' 進めました'; TM.UI.resetSig(); }, 10); break;
      case 'pop': s.pop += 10; break;
      case 'techs': TM.DATA.techs.forEach(function (t2) { if (!s.techs[t2.id]) { s.techs[t2.id] = true; if (t2.setFlag) s.flags[t2.setFlag] = true; } }); break;
      case 'era':
        if (s.era === 0) { s.bld.kama.n = 1; s.era = 1; s.flags.hired = true; s.pop = Math.max(s.pop, 3); s.flags.kama_reveal = true; }
        else {
          var mega = null; TM.DATA.buildings.forEach(function (b) { if (b.stages && b.onComplete && b.onComplete.era === s.era + 1) mega = b; });
          if (mega) {
            TM.DATA.techs.forEach(function (t3) { if ((t3.era || 0) <= s.era && !s.techs[t3.id]) { s.techs[t3.id] = true; if (t3.setFlag) s.flags[t3.setFlag] = true; } });
            /* 大型設備を完成させたことにする（条件は無視） */
            s.bld[mega.id].n = mega.stages;
            var oc = mega.onComplete || {};
            if (oc.era !== undefined && s.era < oc.era) { s.era = oc.era; s.stats.at['era' + oc.era] = s.t; }
            if (oc.ending) { s.ending = 1; s.stats.ended = 1; }
            s.res.money = Math.max(s.res.money, 10 * (E.cost(s, mega).money || 0));
            E.addLog(s, '（開発者モード）' + mega.name + 'を完成させた。', 'dim');
          }
        }
        TM.UI.resetSig(); break;
      case 'reveal': ['hook', 'memo', 'research_known', 'cans_known', 'dcan_known', 'smoke', 'power_known', 'acid_known', 'fecl2_known', 'space_tight'].forEach(function (fl) { s.flags[fl] = true; }); TM.UI.resetSig(); break;
      case 'sim':
        out.textContent = '自動プレイ中…（数十秒〜数分かかります）';
        setTimeout(function () {
          var t0 = Date.now(), r = TM.Sim.run(v, 16);
          var lines = [r.style + '（' + ((Date.now() - t0) / 1000).toFixed(0) + '秒で計算）'];
          Object.keys(r.milestones).forEach(function (k) { lines.push(k + '：' + (r.milestones[k] / 3600).toFixed(1) + '時間（' + (r.milestones[k] / 86400).toFixed(2) + '日）'); });
          if (!r.milestones.ending) lines.push('16日でエンディングに届かず（時代' + r.state.era + '）');
          document.getElementById('dv_out').textContent = lines.join('\n');
        }, 30);
        break;
      case 'dump':
        try { navigator.clipboard.writeText(E.exportText(s)); out.textContent = 'セーブ文字列をコピーしました'; } catch (e2) { out.textContent = E.exportText(s); }
        break;
      case 'off': disable(); return;
    }
    var keep = document.getElementById('dv_out').textContent;
    draw();
    document.getElementById('dv_out').textContent = keep;
  }

  function init() {
    document.getElementById('devpanel').addEventListener('click', onClick);
    try { if (sessionStorage.getItem('taiki-minigame-dev') === '1') enable(); } catch (e) { /* 無視 */ }
  }

  /* 毎ティック：お金無限 */
  function tick(s) { if (on && TM.infMoney) s.res.money = Math.max(s.res.money, 1e15 * Math.pow(1e6, Math.max(0, s.era - 3))); }

  return { ask: ask, init: init, tick: tick, isOn: function () { return on; } };
})();

</script>
<script>
/* 起動・ループ・保存・留守中の進行・エンディング */
(function () {
  var TM = window.TM, E = TM.Engine, U = TM.util;
  E.init();
  TM.UI.init();
  TM.Dev.init();

  var storageOk = true;
  try { localStorage.setItem('taiki-minigame-test', '1'); localStorage.removeItem('taiki-minigame-test'); } catch (e) { storageOk = false; }

  var s = E.load();
  var report = null;
  if (s) {
    var away = (Date.now() - (s.saved || Date.now())) / 1000;
    if (away > 60 && s.era >= 1 && !s.ending) {
      var before = U.deepCopy(s.res);
      var r = E.simulateAway(s, away);
      report = { away: away, sim: r.simulated, before: before };
    }
  } else {
    s = E.newState();
  }
  TM.state = s;
  if (!storageOk) E.addLog(s, '（この環境ではセーブができない。設定から書き出しておくと安心。）', 'dim');

  function showReport(rep) {
    var st = TM.state, rows = '', k;
    var list = [];
    for (k in st.res) {
      var diff = st.res[k] - (rep.before[k] || 0);
      if (Math.abs(diff) > 0.5 && st.flags['r_' + k]) list.push([k, diff]);
    }
    list.sort(function (a, b) { return a[0] === 'money' ? -1 : b[0] === 'money' ? 1 : 0; });
    list.slice(0, 14).forEach(function (x) {
      rows += '<tr><td>' + E.resName(st, x[0]) + '</td><td class="' + (x[1] >= 0 ? 'good' : 'bad') + '">' + (x[1] >= 0 ? '+' : '') + U.fmt(x[1], st.settings.expo) + '</td></tr>';
    });
    TM.UI.openModal('<h2>留守中の記録</h2><p class="note">留守にしていた時間：' + U.fmtTime(rep.away) + '（進んだのは ' + U.fmtTime(rep.sim) + ' ぶん。12時間までは全部、そこから72時間までは4分の1の速さで進む）</p>' +
      '<table class="t">' + rows + '</table><div class="sect" style="text-align:right"><button class="btn" data-a="close">続ける</button></div>');
  }
  if (report && report.away > 120) showReport(report);

  /* ---- ループ ---- */
  var last = Date.now(), saveTimer = 0;
  function loop() {
    var now = Date.now();
    var real = (now - last) / 1000; last = now;
    var st = TM.state;
    if (st.ending === 1 || st.ending === 2) { TM.UI.render(); return; }
    if (real > 120 && st.era >= 1) {
      /* スリープ復帰など：留守扱い */
      var before = U.deepCopy(st.res);
      var r = E.simulateAway(st, real);
      showReport({ away: real, sim: r.simulated, before: before });
    } else {
      var dt = real * TM.speed;
      var stepSec = TM.speed >= 1000 ? 5 : TM.speed > 1 ? 1 : real > 2 ? 1 : 0.2;
      var n = Math.min(2000, Math.ceil(dt / stepSec));
      for (var i = 0; i < n; i++) { TM.Dev.tick(st); E.step(st, dt / n); }
    }
    TM.UI.render();
    saveTimer += real;
    if (saveTimer > 30) { saveTimer = 0; E.save(st); }
  }
  setInterval(loop, 200);
  TM.UI.render(true);

  document.addEventListener('visibilitychange', function () { if (document.hidden) E.save(TM.state); else last = Date.now() - 200 + Math.min(0, 0); });
  window.addEventListener('beforeunload', function () { E.save(TM.state); });
  window.addEventListener('pagehide', function () { E.save(TM.state); });

  /* ---- エンディング ---- */
  TM.UIEnding = function (st) {
    var box = document.getElementById('ending');
    if (st.ending === 1 && box.getAttribute('data-st') !== '1') {
      box.setAttribute('data-st', '1'); box.classList.remove('hidden');
      box.innerHTML = '<div class="line fade">暗い。</div><div><button class="btn fade" id="end_sink">沈める</button></div>';
      document.getElementById('end_sink').onclick = function () { st.ending = 2; E.save(st); TM.UIEnding(st); };
    }
    if (st.ending === 2 && box.getAttribute('data-st') !== '2') {
      box.setAttribute('data-st', '2'); box.classList.remove('hidden');
      var days = (Date.now() - st.started) / 86400000;
      var lines = ['泡が立つ。', '星が、細くなっていく。', '液が、うすい緑に染まった。', '', '―――', '',
        'タイキ薬品工業　ミニゲーム', '', '遊んでくれて、ありがとうございました。', '',
        '遊び始めてから　' + days.toFixed(1) + '日', '稼いだお金　' + U.fmt(st.stats.earned) + '円', '売った缶　' + U.fmt(st.stats.cansSold) + '缶',
        '洗った缶　' + U.fmt(st.stats.washed) + '缶', '逃がした水素　' + U.fmt(st.stats.h2) + 'kg'];
      box.innerHTML = '<div class="credits">' + lines.map(function (l) { return '<div class="fade">' + (l || '&nbsp;') + '</div>'; }).join('') + '</div>' +
        '<div style="margin-top:20px"><button class="btn" id="end_cont">このまま眺める</button> <button class="btn" id="end_new">はじめから</button></div>';
      document.getElementById('end_cont').onclick = function () { st.ending = 3; box.classList.add('hidden'); E.save(st); };
      document.getElementById('end_new').onclick = function () {
        if (!confirm('セーブを消して、はじめから遊びますか？')) return;
        E.wipe(); TM.state = E.newState(); box.classList.add('hidden'); box.removeAttribute('data-st'); TM.UI.resetSig();
      };
    }
  };
})();

</script>
</body>
