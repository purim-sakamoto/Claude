<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイキ薬品工業　ミニゲーム</title>
<style>
/* 色は時代ごとに切り替える（body[data-era]） */
:root {
  --bg: #000; --fg: #ddd; --dim: #777; --line: #333; --btn: #111; --btnfg: #eee; --btnline: #555;
  --accent: #c9a36a; --bad: #d46a5a; --good: #7fb07f; --warn: #d2a24c; --panel: #0a0a0a; --bar: #555; --story: #fff;
}
body[data-era="1"] { --bg: #17120e; --fg: #e6dccd; --dim: #8a7c6a; --line: #3a3027; --btn: #221a14; --btnfg: #f0e6d6; --btnline: #5e4d3c; --panel: #1d1712; --bar: #8a6a45; --accent: #d6a463; --story: #fff4e0; }
body[data-era="2"], body[data-era="3"] { --bg: #ecebe7; --fg: #222; --dim: #777; --line: #cfccc5; --btn: #fff; --btnfg: #222; --btnline: #aaa59b; --panel: #f6f5f2; --bar: #7b8b9a; --accent: #8a5a2b; --bad: #b0473a; --good: #3f7f4f; --warn: #a8741a; --story: #000; }
body[data-era="3"] { --bg: #e7ecee; --panel: #f3f6f7; --bar: #4f7f99; }
body[data-era="4"] { --bg: #e6ece6; --fg: #1f2a22; --dim: #6c786f; --line: #c8d3ca; --btn: #fff; --btnfg: #1f2a22; --btnline: #9fb0a3; --panel: #f2f6f2; --bar: #4f8a62; --accent: #2f6f4a; --bad: #b0473a; --good: #2f7f4f; --warn: #a8741a; --story: #000; }
body[data-era="5"] { --bg: #0c1222; --fg: #d8e0f0; --dim: #7584a3; --line: #243150; --btn: #131c33; --btnfg: #e6ecff; --btnline: #3a4a73; --panel: #10182c; --bar: #5f7fc0; --accent: #9fb8ff; --story: #fff; }
body[data-era="6"] { --bg: #04050b; --fg: #d7d4e8; --dim: #6e6a8a; --line: #1b1a2e; --btn: #0b0b18; --btnfg: #eeeaff; --btnline: #34305a; --panel: #08081a; --bar: #8c79d6; --accent: #c9b8ff; --story: #fff; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-variant-numeric: tabular-nums; background: var(--bg); color: var(--fg); font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; font-size: 14px; transition: background 2s, color 2s; }
button { font: inherit; }
.hidden { display: none !important; }
.dim { color: var(--dim); }
.bad { color: var(--bad); }
.good { color: var(--good); }
.warn { color: var(--warn); }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 1280px; margin: 0 auto; padding: 8px 16px 40px; }
#top { display: flex; gap: 16px; align-items: baseline; min-height: 22px; border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 8px; }
#title { font-size: 12px; color: var(--dim); letter-spacing: .1em; white-space: nowrap; }
#title s { color: var(--dim); }
#memo { flex: 1; font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#memo b { color: var(--accent); font-weight: normal; margin-right: 6px; }
#cal { font-size: 12px; color: var(--dim); white-space: nowrap; }

#main { display: grid; grid-template-columns: 230px minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
#center { min-width: 0; }
#logcol { position: sticky; top: 8px; max-height: calc(100vh - 70px); overflow: hidden; }
#log { font-size: 12.5px; line-height: 1.45; }
#log div { margin-bottom: 3px; opacity: 1; transition: opacity .8s; }
#log div.story { color: var(--story); }
#log div.dim { color: var(--dim); }
#log div:nth-child(n+10) { opacity: .6; }
#log div:nth-child(n+20) { opacity: .35; }
#event { margin-bottom: 8px; }
#event .ev { border: 1px dashed var(--accent); padding: 6px 8px; font-size: 13px; }
#event button { margin-top: 4px; }
#side { position: sticky; top: 8px; max-height: calc(100vh - 70px); overflow-y: auto; }

/* 導入の画面（ログとボタンだけ） */
body.intro #main { grid-template-columns: 1fr; max-width: 520px; margin: 40px auto 0; }
body.intro #side, body.intro #tabs, body.intro #top #memo, body.intro #top #cal { display: none; }
body.intro #logcol { order: 2; position: static; max-height: none; }
body.intro #center { order: 1; }
body.intro #top { border-bottom: none; }
body.intro.noresources #side { display: none; }
body.intro.hasresources #main { grid-template-columns: 1fr 260px; grid-template-areas: "act res" "log res"; max-width: 720px; }
body.intro.hasresources #center { grid-area: act; }
body.intro.hasresources #logcol { grid-area: log; }
body.intro.hasresources #side { display: block; grid-area: res; position: static; }

.btn { display: inline-block; background: var(--btn); color: var(--btnfg); border: 1px solid var(--btnline); padding: 3px 10px; margin: 0 5px 5px 0; line-height: 1.35; cursor: pointer; position: relative; overflow: hidden; text-align: left; border-radius: 2px; }
.btn:hover { border-color: var(--accent); }
.btn.na { opacity: .45; cursor: default; }
.btn .prog { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); }
.btn small { display: block; color: var(--dim); font-size: 11px; line-height: 1.25; }
.mini { background: var(--btn); color: var(--btnfg); border: 1px solid var(--btnline); padding: 1px 7px; cursor: pointer; font-size: 12px; margin-left: 2px; border-radius: 2px; }
.mini:hover { border-color: var(--accent); }
.fade { animation: fadein .9s ease both; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
body.noanim .fade { animation: none; }

#tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
#tabs button { background: none; border: none; color: var(--dim); padding: 4px 10px; cursor: pointer; border-bottom: 2px solid transparent; }
#tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
#tabs button.new::after { content: "●"; color: var(--accent); font-size: 8px; vertical-align: super; margin-left: 2px; }
#actions:empty { display: none; }
/* 手作業ボタンは幅を固定（中の数字や文言が変わっても隣のボタンが動かない） */
#actions { display: flex; gap: 5px; }
#actions .btn { flex: 1 1 0; min-width: 0; max-width: 11em; margin: 0; white-space: nowrap; }
#actions .btn > span:first-child { display: block; overflow: hidden; text-overflow: ellipsis; }
#actions .btn small { overflow: hidden; text-overflow: ellipsis; }
#actions { margin-bottom: 6px; }

/* 資源 */
.res { display: grid; grid-template-columns: minmax(0, 1fr) auto 6.6em; gap: 0 8px; font-size: 12.5px; line-height: 19px; padding: 0; border-bottom: 1px dotted var(--line); }
.res .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .v { text-align: right; font-variant-numeric: tabular-nums; }
.res .v { white-space: nowrap; }
.res .r { text-align: right; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res.full .v { color: var(--warn); }
.res.neg .r { color: var(--bad); }
.resgroup { font-size: 10.5px; color: var(--dim); margin: 6px 0 1px; letter-spacing: .1em; line-height: 15px; }

/* 設備など */
.group { margin-bottom: 8px; }
.group h3 { font-size: 11.5px; color: var(--dim); font-weight: normal; margin: 0 0 4px; letter-spacing: .1em; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 3px; }
.row .btn { flex: 0 0 auto; width: 180px; margin: 0; }
.row .info { flex: 1; min-width: 0; font-size: 11.5px; line-height: 1.35; color: var(--dim); padding-top: 1px; }
.row .info .st { color: var(--fg); min-height: 16px; }
.row .ctl { white-space: nowrap; font-size: 12px; padding-top: 2px; }
.cost { font-size: 11px; }
.cost .lack { color: var(--bad); }
.teaser { color: var(--dim); opacity: .55; font-size: 12px; display: inline-block; border: 1px dashed var(--line); padding: 3px 8px; margin: 0 6px 6px 0; }
.bar { height: 6px; background: var(--line); position: relative; margin-top: 3px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); }
.bar.red i { background: var(--bad); }
table.t { border-collapse: collapse; width: 100%; font-size: 12px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 2px 6px; text-align: right; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th { color: var(--dim); font-weight: normal; }
.flow { font-size: 12px; padding: 5px 0; border-bottom: 1px dotted var(--line); }
.flow .io { color: var(--dim); }
.flow .why { color: var(--bad); }
.card { border: 1px solid var(--line); padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
.card .steps { display: flex; gap: 2px; margin: 6px 0; }
.card .steps span { flex: 1; height: 5px; background: var(--line); }
.card .steps span.done { background: var(--bar); }
.card .steps span.cur { background: var(--accent); }
p.note { font-size: 12px; color: var(--dim); margin: 0 0 10px; }

#gear { background: none; border: 1px solid var(--btnline); color: var(--dim); font-size: 12px; padding: 0 8px; line-height: 18px; border-radius: 2px; cursor: pointer; white-space: nowrap; align-self: center; margin-left: auto; }
#gear:hover { color: var(--fg); border-color: var(--fg); }

#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
#modalbox { background: var(--panel); color: var(--fg); border: 1px solid var(--btnline); padding: 18px 20px; max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; }
#modalbox h2 { font-size: 16px; font-weight: normal; margin: 0 0 12px; }
#modalbox textarea, #modalbox input[type=text], #modalbox input[type=password] { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--btnline); padding: 6px; font-family: monospace; font-size: 12px; }
#modalbox textarea { height: 110px; }
#modalbox .sect { margin: 12px 0; }
#modalbox label { display: block; margin: 6px 0; font-size: 13px; }

#devpanel { position: fixed; right: 12px; bottom: 44px; width: 300px; background: #111; color: #eee; border: 1px solid #c33; padding: 10px; font-size: 12px; z-index: 40; max-height: 70vh; overflow-y: auto; }
#devpanel h4 { margin: 0 0 6px; color: #f66; font-weight: normal; }
#devpanel button { background: #222; color: #eee; border: 1px solid #555; padding: 3px 7px; margin: 2px; cursor: pointer; font-size: 12px; }
#devpanel button.on { border-color: #f66; color: #f88; }
#devpanel pre { white-space: pre-wrap; font-size: 11px; color: #ccc; margin: 6px 0 0; }

#ending { position: fixed; inset: 0; background: #000; color: #ddd; z-index: 60; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px; }
#ending .line { margin: 10px 0; font-size: 15px; }
#ending .btn { background: #000; color: #eee; border-color: #666; }
#ending .credits { max-width: 520px; line-height: 2; font-size: 13px; color: #aaa; }

/* 手伝い中のボタン・資源 */
.btn.hot { border-color: var(--accent); }
.res.hot .r { color: var(--accent); }
.res.alert .v, .res.alert .r { color: var(--bad); }

/* 警告 */
#alerts:empty { display: none; }
#alerts .alert { border: 1px solid var(--bad); color: var(--fg); padding: 6px 10px; margin-bottom: 8px; font-size: 13px; line-height: 1.6; }
#alerts .alert b { color: var(--bad); font-weight: normal; margin-right: 4px; }

/* 流れ（上部の細い帯）：高さは固定。中身が変わっても下のボタンが動かない */
#flowbar:empty { display: none; }
#flowbar { margin-bottom: 8px; font-size: 12px; height: 48px; overflow: hidden; }
#flowbar.one { height: 24px; }
#flowbar .stages { display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; height: 24px; overflow: hidden; }
#flowbar .stage { border: 1px solid var(--line); padding: 1px 8px; border-radius: 2px; color: var(--dim); cursor: default; white-space: nowrap; font-variant-numeric: tabular-nums; }
#flowbar .stage b { font-weight: normal; color: var(--fg); margin-right: 6px; }
#flowbar .stage .v { display: inline-block; min-width: 5.5em; }
#flowbar .stage:first-child .v { min-width: 12em; }
#flowbar .stage.bad { border-color: var(--bad); }
#flowbar .stage.bad b { color: var(--bad); }
#flowbar .arrow { color: var(--dim); font-size: 11px; }
#flowbar .advice { height: 24px; display: flex; align-items: center; gap: 4px; color: var(--dim); white-space: nowrap; overflow: hidden; }
#flowbar .advice .ttl { color: var(--bad); margin-right: 4px; flex: none; }
#flowbar .advice.ok .ttl { color: var(--good); }
#flowbar .advice.broke { color: var(--fg); }
#flowbar .advice .det { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; margin-left: 6px; }
#flowbar .fix { margin: 0; flex: none; text-align: left; line-height: 18px; padding: 0 7px; }
#flowbar .fix.na { opacity: .55; }

/* 特別な知らせ（周年・年商） */
#log div.special { color: var(--accent); border-left: 2px solid var(--accent); padding-left: 8px; animation: special 2.4s ease both; }
#log div.special.anniv { letter-spacing: .05em; }
@keyframes special { 0% { opacity: 0; transform: translateX(-10px); } 30% { opacity: 1; transform: none; text-shadow: 0 0 8px var(--accent); } 100% { text-shadow: none; } }
body.noanim #log div.special { animation: none; }

/* 説明の吹き出し */
#tip { position: fixed; z-index: 70; max-width: 330px; background: var(--panel); color: var(--fg); border: 1px solid var(--btnline); padding: 8px 10px; font-size: 12px; line-height: 1.55; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
#tip .tt { font-size: 13px; margin-bottom: 3px; color: var(--accent); }
#tip .tw { margin: 3px 0; }
#tip .th { color: var(--dim); font-size: 11px; margin-top: 6px; border-bottom: 1px solid var(--line); }
#tip .tl { display: flex; justify-content: space-between; gap: 12px; }
#tip .tl span:first-child { color: var(--dim); white-space: nowrap; }
#tip .tl span:last-child { text-align: right; }

/* 取引タブの見出し・ラインの工程・強調 */
h3.sect { font-size: 13px; font-weight: normal; color: var(--accent); margin: 18px 0 8px; letter-spacing: .1em; }
h3.sect:first-child { margin-top: 0; }
.linebox { margin-top: 4px; font-size: 11px; line-height: 1.6; }
.row.isnew .btn::after { content: "新"; position: absolute; right: 4px; top: 2px; font-size: 9px; color: var(--accent); }
.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 25%, transparent); } 100% { background: transparent; } }

@media (max-width: 960px) {
  #main { grid-template-columns: 1fr; }
  #side { position: static; max-height: none; order: 1; }
  #center { order: 2; }
  #logcol { position: static; max-height: 220px; overflow-y: auto; order: 3; }
  .row { flex-wrap: wrap; }
  .row .btn { min-width: 0; width: 100%; }
  #side #resources { display: block; }
  #actions { flex-wrap: wrap; }
  #actions .btn { flex: 1 1 30%; max-width: none; }
  #flowbar .stages, #flowbar .advice { overflow-x: auto; }
  #flowbar .stage .v, #flowbar .stage:first-child .v { min-width: 0; }
}

/* 資源欄の見出し：種類ごとに色の帯 */
.resgroup.g-raw, .resgroup.g-liq, .resgroup.g-can, .resgroup.g-prod, .resgroup.g-water, .resgroup.g-lab, .resgroup.g-space { border-left: 3px solid var(--line); padding-left: 6px; }
.resgroup.g-raw { border-left-color: #8a7a62; }
.resgroup.g-liq { border-left-color: #3f8f6a; }
.resgroup.g-can { border-left-color: #7b8794; }
.resgroup.g-prod { border-left-color: #c58b2a; }
.resgroup.g-water { border-left-color: #3a78b5; }
.resgroup.g-lab { border-left-color: #8a6bb5; }
.resgroup.g-space { border-left-color: #4a5bb5; }
.res .nm.sold::after { content: '売'; display: inline-block; margin-left: 5px; padding: 0 4px; font-size: 10px; line-height: 14px; border-radius: 3px; background: #c58b2a; color: #fff; vertical-align: 1px; }
.res.dry .r { color: var(--bad); }
.loan { color: var(--warn); }

/* 帳簿 */
.subtabs { display: flex; gap: 4px; margin-bottom: 6px; }
.subtabs .mini.on { border-color: var(--accent); color: var(--accent); }
table.t.fs td, table.t.fs th { padding: 2px 6px; }
table.t.fs td:not(:first-child), table.t.fs th:not(:first-child) { text-align: right; min-width: 7.5em; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t.fs tr.sum td { border-top: 1px solid var(--btnline); }
table.t.fs tr.total td { border-top: 2px double var(--btnline); font-weight: bold; }

</style>
</head>
<body data-era="0" class="intro">
<div id="app">
  <header id="top">
    <div id="title">タイキ薬品工業　<span id="mini">ミニ</span>ゲーム</div>
    <div id="memo"></div>
    <div id="cal"></div>
    <button id="gear" title="設定・開発者モード">⚙ 設定</button>
  </header>
  <main id="main">
    <section id="logcol"><div id="event"></div><div id="log"></div></section>
    <section id="center">
      <div id="alerts"></div>
      <div id="flowbar"></div>
      <nav id="tabs"></nav>
      <div id="actions"></div>
      <div id="panel"></div>
    </section>
    <section id="side"><div id="resources"></div></section>
  </main>
</div>
<div id="tip" class="hidden"></div>
<div id="modal" class="hidden"><div id="modalbox"></div></div>
<div id="devpanel" class="hidden"></div>
<div id="ending" class="hidden"></div>
<script>
/* 汎用関数。全ファイル共通の名前空間 TM を用意する（file:// で動かすため ES Modules は使わない） */
var TM = window.TM = window.TM || {};

TM.util = (function () {
  var UNITS = [
    [1e68, '無量大数'], [1e64, '不可思議'], [1e60, '那由他'], [1e56, '阿僧祇'], [1e52, '恒河沙'],
    [1e48, '極'], [1e44, '載'], [1e40, '正'], [1e36, '澗'], [1e32, '溝'], [1e28, '穣'],
    [1e24, '𥝱'], [1e20, '垓'], [1e16, '京'], [1e12, '兆'], [1e8, '億'], [1e4, '万']
  ];

  function trim(x, digits) {
    var s = x.toFixed(digits);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  /* 数値を日本語の命数で整形する。expo=true なら指数表記 */
  function fmt(n, expo) {
    if (n === null || n === undefined || isNaN(n)) return '0';
    if (!isFinite(n)) return '∞';
    var neg = n < 0; if (neg) n = -n;
    var out;
    if (n < 1e4) {
      out = n >= 100 ? trim(Math.floor(n), 0) : n >= 10 ? trim(n, 1) : trim(n, 2);
    } else if (expo) {
      out = n.toExponential(2).replace('e+', 'e');
    } else {
      out = null;
      for (var i = 0; i < UNITS.length; i++) {
        if (n >= UNITS[i][0]) {
          var v = n / UNITS[i][0];
          out = (v >= 1000 ? trim(v, 0) : v >= 100 ? trim(v, 1) : trim(v, 2)) + UNITS[i][1];
          break;
        }
      }
      if (out === null) out = n.toExponential(2);
    }
    return (neg ? '-' : '') + out;
  }

  /* 桁の決まった数（0.10 / 1.20 / 12.0 / 120）。末尾の0を落とさないので、値が揺れても幅が変わらない */
  function fmtFixed(n, expo) {
    var neg = n < 0; if (neg) n = -n;
    var out;
    if (n < 10) out = n.toFixed(2);
    else if (n < 100) out = n.toFixed(1);
    else if (n < 1e4) out = String(Math.round(n));
    else if (expo) out = n.toExponential(2).replace('e+', 'e');
    else {
      out = null;
      for (var i = 0; i < UNITS.length; i++) if (n >= UNITS[i][0]) { var v = n / UNITS[i][0]; out = v.toFixed(v >= 100 ? 0 : v >= 10 ? 1 : 2) + UNITS[i][1]; break; }
      if (out === null) out = n.toExponential(2);
    }
    return (neg ? '-' : '') + out;
  }

  /* 毎秒の値。小さい値は分あたりで見せる。key を渡すと、/秒 と /分 の切り替えに幅を持たせる（行ったり来たりしない） */
  var rateUnit = {};
  function fmtRate(r, expo, key) {
    if (Math.abs(r) < 1e-9) return '';
    var sign = r > 0 ? '+' : '', a = Math.abs(r), perMin;
    if (key) {
      var prev = rateUnit[key];
      perMin = prev === 'm' ? a < 0.15 : prev === 's' ? a < 0.07 : a < 0.1;
      rateUnit[key] = perMin ? 'm' : 's';
    } else perMin = a < 0.1;
    if (perMin) return sign + fmtFixed(r * 60, expo) + '/分';
    return sign + fmtFixed(r, expo) + '/秒';
  }

  function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) return '—';
    sec = Math.ceil(sec);
    if (sec < 60) return sec + '秒';

      + forks * sumEffectPer('fork', 'forklift') * d.powerEff * mul(m, 'forklift') + ((s.lic.crane > 0 || m['auto.fork']) ? sumEffect(s, 'crane') : 0) * d.powerEff + sumEffect(s, 'autohandle') * d.powerEff) * mul(m, 'handling');
    d.handSup = handSup;
    var handDem = 0;
    D.buildings.forEach(function (b) {
      if (!b.proc || !b.proc.handling) return;
      var on = b.proc.toggle ? s.bld[b.id].on : s.bld[b.id].n;

    });
    var shipPlan = planShipping(s, d, m, glob);
    handDem += shipPlan.handling;
    d.handDem = handDem;
    d.handEff = handDem > 0 ? Math.min(1, handSup / handDem) : 1;
    if (d.handEff < 0.9 && s.era >= 1 && handDem > 0.5) s.flags.handling_short = true;

    /* ---- 汎用プロセス ---- */
    function run(key, name, inp, out, units, reasonPre, spill, hf) {
      /* units: 1秒あたりの実行量 × dt を掛ける前 */
      var want = units * dt, ratio = 1, reason = reasonPre || null, k, wk = null, wt = reasonPre ? 'other' : null;
      if (want <= 0) { d.procs.push({ key: key, name: name, inp: inp, out: out, rate: 0, want: units, eff: 0, reason: reason || '停止', wt: 'other' }); return 0; }
      for (k in inp) {
        var need = inp[k] * want;
        var avail = k === 'money' ? s.res.money + d.creditLimit * 0.95 : s.res[k];
        if (need > 0 && avail < need) { var rr = Math.max(0, avail) / need; if (rr < ratio) { ratio = rr; reason = '入力不足：' + resName(s, k); wk = k; wt = 'in'; } }
      }
      for (k in out) {
        if (out[k] <= 0 || (spill && spill.indexOf(k) >= 0)) continue;
        var space = d.cap[k] - s.res[k], prod = out[k] * want;
        if (prod > space) { var r2 = Math.max(0, space) / prod; if (r2 < ratio) { ratio = r2; reason = '置き場が満杯：' + resName(s, k); wk = k; wt = 'full'; } }
      }
      for (k in inp) { s.res[k] -= inp[k] * want * ratio; led(k, name, -inp[k] * want * ratio, hf); if (k === 'money') finExp(s, name, inp[k] * want * ratio); }
      for (k in out) { s.res[k] += out[k] * want * ratio; led(k, name, out[k] * want * ratio, hf); s.stats.produced[k] = (s.stats.produced[k] || 0) + out[k] * want * ratio; if (k === 'money') finInc(s, name, out[k] * want * ratio); }
      /* 排水処理は、処理する水がないだけなら止まっていても問題ない */
      if (wk === 'waste' && wt === 'in') { reason = '排水待ち（余裕あり）'; wk = null; wt = null; }
      var ok = ratio >= 0.999;
      d.procs.push({ key: key, name: name, inp: inp, out: out, rate: units * ratio, want: units, eff: ratio, reason: ok ? (reasonPre || null) : reason, wk: ok ? null : wk, wt: ok ? (reasonPre ? 'other' : null) : wt });
      return ratio;
    }

    /* 店売り（壺の時代から） */
    d.walkinInc = 0;
    if (s.flags.sold) {
      var hs = heatMul(s, 'sell');
      s.walkin = Math.min(C.walkinCap * mul(m, 'shop'), s.walkin + C.walkinRefill * mul(m, 'shop') * hs * dt);
      if (s.era >= 1) {
        var sell = Math.min(s.walkin, s.res.fecl2, C.walkinRefill * (m.shop ? 2 : 1) * hs * dt);
        if (sell > 0) {
          s.walkin -= sell; s.res.fecl2 -= sell; var inc = sell * C.walkinPrice; s.res.money += inc; finInc(s, '店売り', inc);
          led('fecl2', '店先の客', -sell, hs); led('money', '店売り', inc, hs); d.walkinInc = inc / dt;
        }
      }
      if (s.walkin < 0.5 && s.res.fecl2 >= 20 && s.era >= 1) { s.flags.walkin_empty = true; if (s.upg.shopsign) s.flags.walkin_empty2 = true; }
    }

    /* 洗缶の水：ためすすぎなどで減らせる */
    function washWater(out) {
      var f = mul(m, 'washwater'); if (f === 1) return out;
      var o = {}, k; for (k in out) o[k] = out[k]; o.waste = out.waste * Math.max(0.1, f); return o;
    }
    /* 製造の洗浄水（時代2から）。排水が満水だと、流せる分しか作れない */
    function rinsed(on, out) {
      if (!on || s.era < 2) return out;
      var o = {}, liq = 0, k; for (k in out) { o[k] = out[k]; if (k !== 'cu') liq += out[k]; }
      o.waste = (o.waste || 0) + liq * (C.rinse || 0);
      return o;
    }

    /* 仕入れの設備を先に動かす（後に回すと、使う側が毎ティック空振りして揺れる） */
    D.buildings.forEach(function (b) { if (IN_PROCS['bld.' + b.id] || TREAT[b.id]) runBld(b); });

    /* 配属（汎用の入出力） */
    D.jobs.forEach(function (j) { if (j.id !== 'wash') runJob(j); });
    function runJob(j) {
      if (j.special) return;
      var w = s.jobs[j.id] || 0; if (!w) return;
      if (j.slotsFrom) w = Math.min(w, d.slots[j.slotsFrom] || 0);
      var rate = w * mul(m, 'job.' + j.id) * jobAll * glob, jh = 1;
      if (j.id === 'gather') jh = heatMul(s, 'gather');
      if (j.fumes) { rate *= d.ventEff; jh = heatMul(s, 'dissolve'); }
      rate *= jh;
      var r = run('job.' + j.id, j.name, j.in, j.id === 'wash' ? washWater(j.out) : rinsed(j.rinse, j.out), rate, (j.slotsFrom && s.jobs[j.id] > w) ? '釜が足りない' : null, null, jh);
      if (j.fumes) fumesNow += j.out.fecl2 * rate * r;
      if (j.id === 'wash') s.stats.washed += j.out.can * rate * r * dt;
    }

    /* 設備のプロセス（製造が先、洗缶が後：排水の余裕は製造に回す） */
    D.buildings.forEach(function (b) { if (!IN_PROCS['bld.' + b.id] && !TREAT[b.id] && b.group !== '容器') runBld(b); });
    runJob(JOB.wash);
    D.buildings.forEach(function (b) { if (b.group === '容器') runBld(b); });
    function runBld(b) {
      var p = b.proc; if (!p || !p.out || b.stages) return;
      var n = s.bld[b.id].n; if (!n) return;
      var on = p.toggle ? s.bld[b.id].on : n;
      var reason = null;
      /* 新缶は補充だけ：空き缶が置き場の3割を超えている間は買わない */
      if (b.id === 'canbuy' && s.res.can >= d.cap.can * 0.3) { on = 0; reason = '缶は足りている'; }
      if (p.operator === 'operate') { if (opActive[b.id] < on) reason = '運転の人手が足りない'; on = opActive[b.id]; }
      if (p.needs && !(s.bld[p.needs] && s.bld[p.needs].n > 0)) { on = 0; reason = '必要な設備がない'; }
      var eff = mul(m, 'bld.' + b.id) * glob;
      if (p.power) { eff *= d.powerEff; if (d.powerEff < 0.999) reason = reason || '電力不足'; }
      if (p.handling) { eff *= d.handEff; if (d.handEff < 0.999) reason = reason || '荷役が足りない'; }
      if (p.fumes) eff *= d.ventEff;
      var bh = 1;
      if (p.fumes && p.out.fecl2) bh = heatMul(s, 'dissolve');
      if (b.id === 'scrapbuy' || b.id === 'scrapyard') bh = heatMul(s, 'gather');
      eff *= bh;
      var outM = mul(m, 'bld.' + b.id + '.out');
      var outs = p.out;
      if (outM !== 1) { outs = {}; for (var k in p.out) outs[k] = p.out[k] * outM; }

    }

    /* スクラバーで回収した希塩酸、水素の回収 */

    var hclRec = sumEffect(s, 'hclRecover') * d.powerEff;
    if (hclRec > 0 && fumesNow > 0) { var hr = Math.min(d.cap.hcl - s.res.hcl, fumesNow * Math.min(0.3, hclRec) * dt * 0.66); if (hr > 0) { s.res.hcl += hr; led('hcl', 'スクラバーの回収', hr); } }
    var h2cap = sumEffect(s, 'h2rec') * d.powerEff * glob;
    s.stats.h2 += fumesNow * 0.02 * dt;

    /* 検査（ロット判定） */

    d.checkCap = checkCap;
    var lots = D.lots || [];
    var waitTot = 0; lots.forEach(function (l) { waitTot += Math.max(0, s.res[l.wait]); });
    var checked = 0;
    lots.forEach(function (l) {
      if (waitTot <= 0) return;
      var share = checkCap * dt * (Math.max(0, s.res[l.wait]) / waitTot);
      var mv = Math.min(share, s.res[l.wait], Math.max(0, d.cap[l.ok] - s.res[l.ok]));
      s.res[l.wait] -= mv; s.res[l.ok] += mv; checked += mv;
      led(l.wait, '検査', -mv); led(l.ok, '検査', mv);

    /* 充填 */

    /* 受託 */

    /* 給与と人の増加 */
    /* 給料はいつも払う（足りなければ与信枠から借りる） */
    var sal = s.pop * C.salary * eraSal * mul(m, 'salary') * dt;
    s.res.money -= sal; finExp(s, '給与', sal); led('money', '給料', -sal);
    d.salary = dt > 0 ? sal / dt : 0;
    s.flags.broke = false;
    /* 借りている間は利息がつく */
    d.interest = 0;
    if (s.res.money < 0) {
      s.flags.oncredit = true;
      var intr = -s.res.money * (C.creditRate || 0.0001) * dt;

    }
    /* 与信枠を超えたら、猶予のあと設備を1つずつ手放す */

      if (s.overT >= (C.overGrace || 60)) { s.overT = 0; forcedSale(s, d); }
    } else { s.overT = 0; s.flags.over_warned = false; }
    d.overLeft = s.overT ? Math.max(0, (C.overGrace || 60) - s.overT) : null;
    s.incAvg = (s.incAvg || 0) + ((d.income || 0) - (s.incAvg || 0)) * Math.min(1, dt / 600);

    }

    /* 講習 */

    }

    /* 手作業の溶解（壺） */
    if (s.manual.dissolve > 0) {
      s.manual.dissolve -= dt * mul(m, 'manual.dissolve');
      if (s.manual.dissolve <= 0) {
        s.manual.dissolve = 0;
        s.res.fecl2 = Math.min(d.cap.fecl2 + 3, s.res.fecl2 + C.manualBatch.fecl2);
        s.stats.batches++;
        if (s.stats.batches === 1) addLog(s, '液が、うすい緑に染まった。');
      }
    }

    /* 上限処理 */
    for (var rid in s.res) {
      if (s.res[rid] !== s.res[rid] || s.res[rid] === Infinity) s.res[rid] = 0; /* NaN・無限大の保険 */
      if (s.res[rid] < 0 && rid !== 'money') s.res[rid] = 0;
      if (d.cap[rid] !== undefined && s.res[rid] > d.cap[rid] && rid !== 'fecl2') s.res[rid] = d.cap[rid];
    }
    if (s.res.fecl2 > d.cap.fecl2 + 3) s.res.fecl2 = d.cap.fecl2 + 3;
    if (s.res.research > d.cap.research) s.res.research = d.cap.research;

    /* 毎秒の増減。一度でも手にした資源は表示する */
    for (var r2 in s.res) {
      d.rate[r2] = dt > 0 ? (s.res[r2] - before[r2]) / dt - (d.heatX[r2] || 0) : 0;
      if (s.res[r2] > 0.0001 && !s.flags['r_' + r2]) s.flags['r_' + r2] = true;
    }
    smooth(s, d, dt);

    /* 敷地 */
    if (d.used >= d.land * 0.85 && s.era >= 1) s.flags.space_tight = true;
    if (s.era >= 1 && (s.res.scrap >= d.cap.scrap * 0.99 || s.res.hcl >= d.cap.hcl * 0.99)) s.flags.raw_full = true;
    if (!s._away) refreshShown(s);

    /* 暦・月次・物語・出来事 */
    s.fin.monthT += dt;
    var dep = (s.fin.book || 0) * Math.min(1, dt / (C.depSec || 6000));
    s.fin.book = (s.fin.book || 0) - dep; s.fin.cur.dep = (s.fin.cur.dep || 0) + dep;
    if (s.fin.monthT >= C.monthSec) {

      s.fin.cur.cash1 = Math.max(0, s.res.money); s.fin.cur.debt1 = Math.max(0, -s.res.money); s.fin.cur.book1 = s.fin.book; s.fin.cur.inv1 = invValue(s, d);

    }

    checkStory(s);
    checkHook(s);
    doEvents(s, dt);

  }

  /* ---- 暦：創業年から。1年の長さは時代ごとに違う（だいたい史実っぽい年に時代が変わるように） ---- */
  function seasonIdx(s) { var yf = s.cal ? s.cal.yf : 0; return Math.floor((yf - Math.floor(yf)) * 4) % 4; }
  function calYear(s) { return D.calendar.founded + Math.floor(s.cal ? s.cal.yf : 0); }

    var after = Math.floor(cal.yf);
    for (var y = before + 1; y <= after; y++) {
      var year = K.founded + y;
      /* 年商（その1年の売上） */

      });

        var txt = K.anniv[y] || K.annivDefault[(y / 10) % K.annivDefault.length];
        addLog(s, '創業' + y + '周年（' + year + '年）。' + txt, 'special anniv');
      }
    }
  }

  /* 酸も液もお金もなく、手が止まっている（ツケで酸を分けてもらえる） */
  function stuck(s) { return s.res.hcl < 2 && s.res.fecl2 < 3 && s.res.money < C.acidBuy.cost; }

  /* 在庫の評価（売値の半分＝原価のつもり） */
  function invValue(s, d) {
    var seen = {}, v = 0;
    ((d && d.sales) || []).forEach(function (x) { if (seen[x.stock]) return; seen[x.stock] = 1; v += Math.max(0, s.res[x.stock] || 0) * x.price * 0.5; });
    if (s.era >= 1 && !seen.fecl2) v += Math.max(0, s.res.fecl2 || 0) * C.walkinPrice * 0.5;
    return v;
  }
  /* 財務三表（月ごと）。p：s.fin.cur か s.fin.hist[i] */

    for (k in p.inc) { v = p.inc[k]; if (k === '臨時') other += v; else if (k === '設備の売却') saleIn += v; else R += v; }
    for (k in p.exp) {

      else if (k === '研究' || (BLDN[k] && BLDN[k].group === '研究')) rnd += v;
      else cogs += v;
    }
    var dep = p.dep || 0, gross = R - cogs, op = gross - sga - rnd - dep, ord = op + other - intr;
    var cash1 = live ? Math.max(0, s.res.money) : p.cash1, debt1 = live ? Math.max(0, -s.res.money) : p.debt1;
    var cfo = R + other - cogs - sga - rnd - intr, cfi = saleIn - capex, cff = (debt1 || 0) - (p.debt0 || 0);
    return {
      pl: { sales: R, cogs: cogs, gross: gross, sga: sga, rnd: rnd, dep: dep, op: op, other: other, intr: intr, ord: ord },
      cf: { op: cfo, inv: cfi, fin: cff, net: cfo + cfi + cff, cash0: p.cash0 || 0, cash1: cash1 || 0, capex: capex, saleIn: saleIn },
      bs: { cash: cash1 || 0, inv: live ? invValue(s, d) : (p.inv1 || 0), book: live ? (s.fin.book || 0) : (p.book1 || 0), debt: debt1 || 0 }
    };
  }

  /* 与信枠：借りられる上限（信用と稼ぎに応じて） */
  function creditLimit(s) {
    if (s.era < 1) return 0;
    return 60 + (s.res.credit || 0) * 5 + Math.max(0, s.incAvg || 0) * 1800;
  }

  /* 画面に出す毎秒の値はならす（工程どうしの取り合いで毎ティック揺れるため） */
  var SMOOTH_TAU = 6, snapT = 0;
  /* 人や設備を動かした直後は、ならしを短くしてすぐ数字に出す（計画が立てやすいように） */
  var snapN = 0;
  function snap() { snapT = 2; snapN++; }
  function smooth(s, d, dt) {
    var tau = snapT > 0 ? 0.35 : SMOOTH_TAU; if (!s._away) snapT = Math.max(0, snapT - dt);
    var a = 1 - Math.exp(-dt / tau), k, n;
    if (!d.rateS) { d.rateS = {}; d.ledS = {}; a = 1; }
    for (k in d.rate) { var o = d.rateS[k]; d.rateS[k] = o === undefined ? d.rate[k] : o + (d.rate[k] - o) * a; }
    for (k in d.led) { var L = d.ledS[k] || (d.ledS[k] = {}); for (n in d.led[k]) if (L[n] === undefined) L[n] = 0; }
    for (k in d.ledS) {
      var LS = d.ledS[k], cur = d.led[k] || {};
      for (n in LS) { LS[n] += ((cur[n] || 0) - LS[n]) * a; if (Math.abs(LS[n]) < 1e-12 && !cur[n]) delete LS[n]; }
    }
    var inc = (d.income || 0) + (d.walkinInc || 0);
    d.incomeS = d.incomeS === undefined ? inc : d.incomeS + (inc - d.incomeS) * a;
    d.filledS = d.filledS === undefined ? (d.filled || 0) : d.filledS + ((d.filled || 0) - d.filledS) * a;
    var mo = 0; (d.procs || []).forEach(function (p) { if (procStage(p.key) === 'make') for (var o in p.out) if (D.flow.liquid.indexOf(o) >= 0) mo += p.out[o] * p.rate; });
    d.makeOutS = d.makeOutS === undefined ? mo : d.makeOutS + (mo - d.makeOutS) * a;
  }

  function sumEffect(s, key) {
    var t = 0;
    D.buildings.forEach(function (b) {
      if (!b.effects || b.effects[key] === undefined || b.stages) return;
      var n = s.bld[b.id].n; if (!n) return;
      if (b.effects.needs && !(s.bld[b.effects.needs] && s.bld[b.effects.needs].n > 0)) return;
      if (b.effects.needsRes && (s.res[b.effects.needsRes] || 0) < 1) return;
      t += b.effects[key] * n;
    });
    return t;
  }
  function sumEffectPer(bid, key) { return BLD[bid] && BLD[bid].effects ? BLD[bid].effects[key] || 0 : 0; }

  /* ---------------- 充填 ---------------- */
  function lineCap(s, m) {
    var mn = Infinity, worst = null, det = [];
    D.lineModules.forEach(function (mod) {
      var lv = Math.min(mod.levels.length - 1, Math.round(m['line.' + mod.id] || 0));
      var rate = mod.levels[lv][1] * mul(m, 'linespeed');
      det.push({ id: mod.id, name: mod.name, lv: lv, label: mod.levels[lv][0], rate: rate });
      if (rate < mn) { mn = rate; worst = mod.id; }
    });
    return { rate: mn, worst: worst, det: det };
  }

  function doFill(s, d, m, dt, jobAll, glob) {
    var w = s.jobs.fill || 0;
    var lines = s.bld.line ? s.bld.line.n : 0, fillers = s.bld.filler ? s.bld.filler.n : 0;
    var autoLine = m['auto.line'] > 0;
    var lc = lineCap(s, m); d.lineInfo = lc;
    var linesManned = autoLine ? lines : Math.min(lines, Math.floor(w / 2)); w -= autoLine ? 0 : linesManned * 2;
    var fillersManned = autoLine ? fillers : Math.min(fillers, w); w -= autoLine ? 0 : fillersManned;
    var handRate = Math.max(0, w) * JOB.fill.rate * mul(m, 'job.fill') * jobAll;
    var fRate = fillersManned * sumEffectPer('filler', 'filler') * d.powerEff * mul(m, 'filler');
    var lRate = linesManned * lc.rate * d.powerEff;
    var cap = (handRate + fRate + lRate) * glob;
    d.fillCap = cap; d.linesManned = linesManned; d.lineRate = lRate * glob; d.fillersManned = fillersManned;
    if (cap <= 0) return;
    var budget = cap * dt;
    var cands = [];
    D.products.forEach(function (p) {
      if (p.kind !== 'can') return;
      if (p.license && !(s.lic[p.license] > 0)) return;
      if (p.unlock && !cond(s, p.unlock)) return;
      var kg = p.kg || C.canKg;
      var maxBy = Math.min(s.res[p.liquid] / kg, d.cap[p.id] - s.res[p.id]);
      if (p.container === 'can') maxBy = Math.min(maxBy, s.res.can);
      if (maxBy <= 0) return;
      var room = 1 - s.res[p.id] / Math.max(1, d.cap[p.id]);
      cands.push({ p: p, kg: kg, max: maxBy, w: Math.max(0.05, room) * (p.fillWeight || 1) });
    });
    var wsum = 0; cands.forEach(function (c) { wsum += c.w; });
    var filled = 0, lineShare = cap > 0 ? lRate * glob / cap : 0;
    cands.forEach(function (c) {
      var amt = Math.min(budget * c.w / wsum, c.max);
      if (c.p.container === 'can') amt = Math.min(amt, s.res.can);
      if (amt <= 0) return;
      s.res[c.p.liquid] -= amt * c.kg; d.ledf(c.p.liquid, '充填', -amt * c.kg);
      if (c.p.container === 'can') { s.res.can -= amt; d.ledf('can', '充填', -amt); }
      else if (c.p.containerCost) { var cc = amt * c.p.containerCost; s.res.money -= cc; finExp(s, '容器', cc); d.ledf('money', '容器', -cc); }
      s.res[c.p.id] += amt; filled += amt; d.ledf(c.p.id, '充填', amt);
    });
    d.filled = dt > 0 ? filled / dt : 0;
    /* ラインのクレーム（重量検査が抜き取りのとき） */
    if (lines > 0 && Math.round(m['line.weigh'] || 0) < 1) {
      var lineCans = filled * lineShare;
      s._claimAcc = (s._claimAcc || 0) + lineCans * 0.01;
      if (s._claimAcc >= 1) {
        s._claimAcc -= 1;
        var loss = Math.max(1, s.res.credit * 0.01) * (m.claimHalf ? 0.5 : 1);
        s.res.credit = Math.max(0, s.res.credit - loss);
        s.flags.claimPending = true;
      }
    }
  }

  /* ---------------- 出荷 ---------------- */
  function zoneInfo(s, d, m) {
    /* 缶の輸送力・ゾーン、バルク輸送力・ゾーン */
    var drivers = s.jobs.deliver || 0;
    var lic = {}; for (var k in s.lic) lic[k] = s.lic[k];
    var autoDrv = m['auto.drive'] > 0;
    var vs = d.vehicles.slice().sort(function (a, b) { return (b.t.rate || 0) - (a.t.rate || 0); });
    var canRate = 0, bulkRate = 0, canZone = 0, bulkZone = -1, used = 0, missing = [];
    d.vehStat = {};
    vs.forEach(function (v) {
      var t = v.t, n = v.n;
      var why = null;
      if (t.requires) { for (var i = 0; i < t.requires.length; i++) if (!(s.bld[t.requires[i]] && s.bld[t.requires[i]].n > 0)) { missing.push(t.requires[i]); n = 0; why = '足りない設備：' + BLD[t.requires[i]].name; } }
      var manned = n;
      if (!autoDrv) {
        manned = Math.min(n, drivers - used);
        if (t.license) {
          var pool = t.license === 'jmid' ? (lic.jmid || 0) + (lic.mid || 0) + (lic.big || 0) : t.license === 'mid' ? (lic.mid || 0) + (lic.big || 0) : (lic[t.license] || 0);
          manned = Math.min(manned, pool);
          /* 使った免許を減らす（上位から順に） */
          var left = manned, order = t.license === 'jmid' ? ['jmid', 'mid', 'big'] : t.license === 'mid' ? ['mid', 'big'] : [t.license];
          order.forEach(function (o) { var u2 = Math.min(left, lic[o] || 0); lic[o] = (lic[o] || 0) - u2; left -= u2; });
        }
        manned = Math.max(0, manned); used += manned;
        if (manned < n) why = why || (t.license && manned >= 0 ? '運転手（' + LIC[t.license].name + '・配達の人手）が足りない' : '運転手（配達の人手）が足りない');
      }
      d.vehStat[v.b.id] = { n: v.n, manned: manned, why: why };
      if (manned <= 0) return;
      if (t.kind === 'bulk') { bulkRate += t.rate * manned; bulkZone = Math.max(bulkZone, t.zone); }
      else { canRate += t.rate * manned; canZone = Math.max(canZone, t.zone); }
    });
    var walkers = autoDrv ? 0 : Math.max(0, drivers - used);
    canRate += walkers * JOB.deliver.rate * mul(m, 'walk') * mul(m, 'job.deliver');
    canRate *= heatMul(s, 'sell');
    canZone += (m.zone || 0); bulkZone = bulkZone >= 0 ? bulkZone + (m.zone || 0) : -1;
    var maxZ = D.zones.length - 1;
    return { canRate: canRate * mul(m, 'transport'), bulkRate: bulkRate * mul(m, 'transport') * mul(m, 'bulk'),
      canZone: Math.min(maxZ, canZone), bulkZone: Math.min(maxZ, bulkZone), walkers: walkers, missing: missing };
  }

  function demandOf(s, d, m, p, zone) {
    if (zone < 0) return 0;
    var z = D.zones[zone];
    var season = p.season ? p.season[seasonIdx(s)] : 1;
    var credit = 1 + Math.log(1 + s.res.credit) / Math.LN10 * 0.6;
    var big = 1 + 0.25 * Math.min(8, sumEffect(s, 'bigpack'));
    return big * p.demand * z.demand * mul(m, 'demand') * mul(m, 'demand.' + p.id) * credit * season;
  }
  function priceOf(s, d, m, p, zone) {
    var z = D.zones[Math.max(0, zone)];
    var q = p.quality ? 1 + (m.quality || 0) + sumEffect(s, 'quality') : 1;
    return p.price * z.price * mul(m, 'price') * mul(m, 'price.' + p.id) * q * (s.era >= 4 ? 1 + d.circ * 0.5 : 1);
  }

  function planShipping(s, d, m, glob) {
    var zi = zoneInfo(s, d, m); d.zi = zi;
    var plan = { handling: 0, items: [] };
    var canLeft = zi.canRate * glob, bulkLeft = zi.bulkRate * glob;
    var list = D.products.filter(function (p) { return !p.unlock || cond(s, p.unlock); });
    list = list.slice().sort(function (a, b) { return priceOf(s, d, m, b, 0) / (b.kg || C.canKg) - priceOf(s, d, m, a, 0) / (a.kg || C.canKg); });
    list.forEach(function (p) {
      if (p.license && !(s.lic[p.license] > 0)) return;
      var zone = p.kind === 'bulk' ? zi.bulkZone : p.kind === 'direct' ? (p.zone || 0) : zi.canZone;
      if (p.kind === 'bulk' && zone < 0) return;
      var dem = demandOf(s, d, m, p, zone);
      var stockRes = p.kind === 'bulk' || p.kind === 'direct' ? p.src : p.id;
      var rate = dem;
      if (p.kind === 'can') { rate = Math.min(rate, canLeft); canLeft -= rate; }
      if (p.kind === 'bulk') { rate = Math.min(rate, bulkLeft); bulkLeft -= rate; }
      plan.items.push({ p: p, zone: zone, rate: rate, dem: dem, stock: stockRes });
      if (p.kind === 'can') plan.handling += rate;
      if (p.kind === 'direct') plan.handling += rate * (p.handling || 0);
    });
    plan.canLeft = canLeft; plan.bulkLeft = bulkLeft;
    return plan;
  }

  function doShipping(s, d, m, dt, plan, glob) {
    d.sales = []; d.dcanBlock = false;
    var totalInc = 0;
    plan.items.forEach(function (it) {
      var p = it.p;
      var want = it.rate * dt;
      if (p.kind === 'can' || p.kind === 'direct') want *= d.handEff;
      var amt = Math.min(want, s.res[it.stock]);
      /* 缶は配達の帰りに、前に届けた缶（空き缶）を引き取ってくる。置き場がなければ配達に出られない */
      var ret = 0;
      if (p.kind === 'can' && p.container === 'can' && amt > 0) {
        ret = Math.min(s.custCans || 0, amt);
        var room = Math.max(0, d.cap.dcan - s.res.dcan);
        if (ret > room) { amt = Math.max(0, amt - (ret - room)); ret = Math.min(ret, room); d.dcanBlock = true; }
      }
      var price = priceOf(s, d, m, p, it.zone);
      var inc = amt * price;
      if (amt > 0) {
        var sh = p.kind === 'can' && it.rate < it.dem * 0.999 ? heatMul(s, 'sell') : 1;
        s.res[it.stock] -= amt; d.ledf(it.stock, '出荷', -amt, sh);
        s.res.money += inc; totalInc += inc; d.ledf('money', p.kind === 'bulk' ? 'ローリー出荷' : p.kind === 'direct' ? '引き取り' : '缶の出荷', inc, sh);
        finInc(s, p.name, inc);
        s.stats.sold[p.id] = (s.stats.sold[p.id] || 0) + amt;
        if (p.kind === 'bulk') s.stats.lorryUsed = 1;
        if (p.kind === 'can') {
          s.stats.cansSold += amt;
          s.res.credit += amt * 0.02 * mul(m, 'credit');
          if (p.container === 'can') {
            var rr = Math.min(0.97, C.returnRate * mul(m, 'return'));
            s.custCans = Math.max(0, (s.custCans || 0) - ret) + amt * rr;
            s.stats.cansLost = (s.stats.cansLost || 0) + amt * (1 - rr);
            if (ret > 0) { s.res.dcan += ret; d.ledf('dcan', '配達の帰りに回収', ret); }
          }
        } else s.res.credit += amt * (p.creditPer || 0.001) * mul(m, 'credit');
        if (p.spent && s.flags.spent_on) s.spentPipe += amt * (p.kind === 'can' ? 20 : 1) * p.spent;
      }
      d.sales.push({ p: p, zone: it.zone, dem: it.dem, rate: dt > 0 ? amt / dt : 0, price: price, cap: it.rate, stock: it.stock });
    });
    d.income = dt > 0 ? totalInc / dt : 0;
  }

  /* ---------------- 受託 ---------------- */
  function doContracts(s, d, m, dt, glob) {
    var K = s.contracts; if (!D.contracts || !s.techs[D.contracts.tech]) return;
    K.timer -= dt;
    if (K.timer <= 0) {
      K.timer = D.contracts.offerSec;
      if (K.offers.length < 3) {
        var pool = D.contracts.templates.filter(function (t) { return cond(s, t.unlock); });
        if (pool.length) {
          var tpl = pool[Math.floor(U.rng(s) * pool.length)];
          var scale = Math.pow(D.contracts.scaleBase, s.era) * (1 + K.done * 0.15);
          K.offers.push({ id: ++K.seq, tpl: tpl.id, scale: scale });
        }
      }
    }
    var slots = (s.jobs.sales || 0) + (m['sales.slots'] || 0);
    d.contractSlots = slots;
    var running = 0;
    K.active.forEach(function (c) {
      var tpl = tplById(c.tpl);
      if (c.step >= D.contracts.steps.length) {
        /* 継続受託：毎秒の収入と消費 */
        var ok = 1, k;
        for (k in tpl.use) { var need = tpl.use[k] * c.scale * dt; if (need > 0 && s.res[k] < need) ok = Math.min(ok, s.res[k] / need); }
        for (k in tpl.use) { s.res[k] -= tpl.use[k] * c.scale * dt * ok; d.ledf(k, '受託', -tpl.use[k] * c.scale * dt * ok); }
        var inc = tpl.income * c.scale * ok * glob * dt * mul(m, 'contract');
        s.res.money += inc; finInc(s, '受託', inc); d.ledf('money', '受託', inc);
        c.eff = ok;
        return;
      }
      if (running >= slots) { c.waiting = '営業の人手が足りない'; return; }
      running++;
      var st = D.contracts.steps[c.step];
      var need2 = st.needs ? (tpl.needs || {})[st.id] : null;
      if (need2 && !cond(s, need2)) { c.waiting = '保留：必要な設備・分析がない'; return; }
      c.waiting = null;
      c.prog += dt * mul(m, 'contract.speed');
      if (c.prog >= st.sec) {
        c.prog = 0;
        if (st.id === 'eval') {
          var q = 0.55 + (m.quality || 0) + sumEffect(s, 'quality');
          if (U.rng(s) > Math.min(0.95, q)) { c.step = 1; addLog(s, '受託「' + tpl.name + '」：サンプルが不合格。検討からやり直し。', 'dim'); return; }
        }
        c.step++;
        if (c.step >= D.contracts.steps.length) { K.done++; s.stats.contractsDone = K.done; addLog(s, '受託「' + tpl.name + '」が製品化された。毎月の収入になる。'); }
      }
    });
  }
  function tplById(id) { for (var i = 0; i < D.contracts.templates.length; i++) if (D.contracts.templates[i].id === id) return D.contracts.templates[i]; return null; }

  /* ---------------- 物語・フック・出来事 ---------------- */
  function checkStory(s) {
    D.story.forEach(function (st) {
      if (s.storySeen[st.id]) return;
      if (!cond(s, st.cond)) return;
      s.storySeen[st.id] = true;
      if (st.setFlag) s.flags[st.setFlag] = true;
      s.stats.at[st.id] = s.t;
      addLog(s, st.text, st.cls || 'story');
    });
  }
  function checkHook(s) {
    if (s.era >= 1 && !s.flags.hook && s.t >= Math.max(C.hookSec, (s.stats.at.era1 || 0) + 120)) {
      s.flags.hook = true; s.flags.research_known = true; s.stats.at.hook = s.t;
      addLog(s, '帳面をつけ始めた。考えることが増えた。');
      addLog(s, '夜、釜の液面に星が映っていた。', 'story');
    }
    if (s.flags.hook && !s.flags.memo && s.t >= Math.max(C.memoSec, s.stats.at.hook + 150)) {
      s.flags.memo = true; s.stats.at.memo = s.t;
      addLog(s, '留守のあいだも、釜は溶かし続ける。', 'story');
    }
  }
  function doEvents(s, dt) {
    if (s.era < 1) return;
    if (s.evActive) { s.evActive.left -= dt; if (s.evActive.left <= 0) s.evActive = null; return; }
    s.evTimer -= dt;
    if (s.evTimer > 0) return;
    s.evTimer = 400 + U.rng(s) * 600;
    var pool = D.events.filter(function (e) { return cond(s, e.cond); });
    if (!pool.length) return;
    var e = pool[Math.floor(U.rng(s) * pool.length)];
    s.evActive = { id: e.id, left: 90 };
  }
  function claimEvent(s) {
    if (!s.evActive) return;
    var e = null; D.events.forEach(function (x) { if (x.id === s.evActive.id) e = x; });
    s.evActive = null; if (!e) return;
    var d = derive(s);
    for (var k in e.give) {
      var v = e.give[k];
      var amt = v === 'cap' ? (isFinite(d.cap[k]) ? Math.max(0, d.cap[k] - s.res[k]) * 0.5 : Math.max(10, (d.rate && d.rate[k] > 0 ? d.rate[k] : 0) * 600))
        : v === 'income60' ? Math.max(20, (d.income || 0) * 60) : v;
      s.res[k] += amt;
      if (k === 'money') finInc(s, '臨時', amt);
    }
    addLog(s, e.text + '（受け取った）', 'dim');
  }

  /* ================= プレイヤーの操作 ================= */
  /* 手作業。時代1からは、押すたびにその工程を「手伝う」（しばらく速くなる） */
  var actions = {
    grope: { vis: function (s) { return !s.flags.groped; }, run: function (s) { s.flags.groped = true; addLog(s, '冷たい。釘が一本。'); } },
    pick: {
      vis: function (s) { return s.flags.groped && s.era < 3; },
      label: function (s) { return s.era >= 1 ? '鉄くずを拾う' : '拾う'; },
      heat: 'gather',
      run: function (s) {
        var d = derive(s);
        if (s.era >= 1) addHeat(s, 'gather');
        if (s.res.scrap >= d.cap.scrap) return;
        s.res.scrap = Math.min(d.cap.scrap, s.res.scrap + 1 * (s.era >= 1 ? mul(d.m, 'job.gather') : 1));
        if (!s.flags.picked) { s.flags.picked = true; addLog(s, '鼻を刺す匂い。壺がある。'); }
      }
    },
    sink: {
      vis: function (s) { return s.flags.picked && s.era < 3; },
      label: function (s) { return s.era >= 1 ? (s.flags.acid_known ? '塩酸で溶かす' : '酸で溶かす') : '沈める'; },
      heat: 'dissolve',
      busy: function (s) { return s.manual.dissolve > 0; },
      can: function (s) { return s.res.scrap >= 1 && s.res.hcl >= 2; },
      ok: function (s) { return s.era >= 1 || (actions.sink.can(s) && s.manual.dissolve <= 0); },
      run: function (s) {
        if (!actions.sink.ok(s)) return;
        if (s.era >= 1) {
          /* 待たずにその場で溶かし、溶解の工程も手伝う */
          addHeat(s, 'dissolve');
          if (!actions.sink.can(s)) return;
          var d = derive(s);
          s.res.scrap -= C.manualBatch.scrap; s.res.hcl -= C.manualBatch.hcl;
          s.res.fecl2 = Math.min(d.cap.fecl2 + 3, s.res.fecl2 + C.manualBatch.fecl2 * mul(d.m, 'manual.dissolve'));
          s.stats.batches++;
          return;
        }
        s.res.scrap -= C.manualBatch.scrap; s.res.hcl -= C.manualBatch.hcl;
        s.manual.dissolve = C.manualDissolveSec;
        if (!s.flags.sunk) { s.flags.sunk = true; addLog(s, '泡が立つ。釘が、細くなっていく。'); }
      }
    },
    give: {
      vis: function (s) { return s.flags.knock && s.era < 3; },
      label: function (s) { return s.era >= 2 ? '売り込みに回る' : s.era >= 1 ? '店先で売る' : '渡す'; },
      heat: 'sell',
      ok: function (s) { return s.era >= 1 || (s.res.fecl2 >= 1 && s.walkin >= 1); },
      run: function (s) {
        if (s.era >= 1) addHeat(s, 'sell');
        var amt = Math.min(s.res.fecl2, s.walkin); if (amt <= 0) return;
        s.res.fecl2 -= amt; s.walkin -= amt;
        var inc = amt * C.walkinPrice; s.res.money += inc; finInc(s, '店売り', inc);
        if (!s.flags.sold) { s.flags.sold = true; addLog(s, '硬貨が手に残る。'); }
      }
    },
    buyacid: {
      vis: function (s) { return s.flags.sold && s.era < 3; },
      label: function (s) { return s.flags.acid_known ? '塩酸を買う' : '酸を買う'; },
      ok: function (s) { var d = derive(s); return (s.res.money + creditLimit(s) >= C.acidBuy.cost || stuck(s)) && s.res.hcl < d.cap.hcl; },
      cost: function () { return { money: C.acidBuy.cost }; },
      run: function (s) {
        var d = derive(s); if (!actions.buyacid.ok(s)) return;

  /* 実行。maxDays 日まで、または完成まで */
  /* 自動プレイは与信枠で設備を買わない（手持ちの範囲で判断する） */
  function run(styleId, maxDays, opts) {
    if (E.setNoCredit) E.setNoCredit(true);

  }
  function run0(styleId, maxDays, opts) {
    opts = opts || {};

<script>
/* 画面の描画。状態(TM.state)を読み、操作はエンジンの関数を呼ぶ */

    var sig = rows.join(',') + '|' + extra.join(',');
    var box = $('resources');
    if (sig !== lastSig.res) {
      lastSig.res = sig; box.innerHTML = ''; refs.res = {};
      var byG = {};
      rows.forEach(function (id) { var g = E.RES[id].grp || 'raw'; (byG[g] = byG[g] || []).push(id); });
      (D.resGroups || [{ id: 'raw', name: '' }]).forEach(function (G) {
        var ids = byG[G.id]; if (!ids) return;

      extra.forEach(function (id) {

        var row = el('div', { class: 'res fade', 'data-tip': 'x:' + id }, [nm, v, r]);

      if (id === 'pop') { setText(x.nm, '人手'); setText(x.v, s.pop + ' / ' + d.popCap + '人'); setText(x.r, E.idle(s) > 0 ? '手すき ' + E.idle(s) + '人' : ''); x.row.classList.toggle('alert', false); }

  /* 出入りがほぼ同じ（差が流れの3%未満）なら「釣り合い」と見せる。小さな差の揺れで数字が踊らないように */
  var balState = {};

  function renderFlow(s, d) {

    if (L) for (n in L) { if (L[n] > 1e-9) ins.push([n, L[n]]); else if (L[n] < -1e-9) outs.push([n, L[n]]); }
    ins.sort(function (a, b) { return b[1] - a[1]; }); outs.sort(function (a, b) { return a[1] - b[1]; });
    if (ins.length) h += '<div class="th">増える</div>' + ins.slice(0, 5).map(function (x) { return line(x[0], rateS(x[1], unit), 'good'); }).join('');
    if (outs.length) h += '<div class="th">減る</div>' + outs.slice(0, 5).map(function (x) { return line(x[0], rateS(x[1], unit), 'bad'); }).join('');
    return h;
  }
  function stalledBy(d, k, wt) {
    var n = []; (d.procs || []).forEach(function (p) { if (p.wk === k && p.wt === wt && p.want > 0) n.push(p.name); });
    return n;
  }
  function eff(s, d) { return 1; }

  function tipHTML(s, d, key) {
    var i = key.indexOf(':'), kind = key.slice(0, i), id = key.slice(i + 1), h = '', C = D.consts;
    if (kind === 'res') {
      var R = E.RES[id], v = s.res[id], cap = d.cap[id], net = RT(d)[id] || 0;
      var unit = R.unit === '円' ? '円' : R.unit === '個' || R.unit === '缶' || R.unit === '箱' ? '' : R.unit;
      h += '<div class="tt">' + E.resName(s, id) + '</div>';
      if (id === 'money') {
        h += line('いま', f(v) + '円', v < 0 ? 'bad' : '');
        h += line('毎秒', rateS(net, '円'), net < 0 ? 'bad' : 'good');
        h += ledger(s, d, id, '円');
        if (v < 0) h += '<div class="tw ' + (v < -d.creditLimit ? 'bad' : 'warn') + '">与信枠で借りている（枠 ' + f(d.creditLimit) + '円）。利息 ' + f(d.interest || 0) + '円/秒。借りている間は新しい人が来ない。</div>';
        return h;
      }
      h += line('いま', f(v) + (cap !== Infinity && cap !== undefined ? ' / ' + f(cap) : '') + (R.unit ? ' ' + R.unit : ''));
      if (balState[id]) h += line('毎秒', '釣り合い（入る量 ≒ 出る量）');
      else if (Math.abs(net) > 1e-9) h += line('毎秒', rateS(net, unit), net < 0 ? 'bad' : 'good');
      if (soldNow(s, d, id)) h += '<div class="tw">いま売っている品（<b>売</b>）。</div>';
      if (id === 'dcan' || id === 'can') {
        h += '<div class="tw">缶はめぐる：新缶を買う → 詰める → 配達 → 帰りに空き缶を引き取る（' + Math.round(Math.min(0.97, D.consts.returnRate * (1 + (d.m.return || 0))) * 100) + '%が戻る）→ 洗う（5%は傷んで廃棄）→ また詰める。' + (id === 'dcan' ? '<b>汚れた缶の置き場がいっぱいになると、引き取れないので配達に出られない。</b>' : '') + '</div>';
      }
      if (id === 'waste') {
        h += line('そのまま流せる分', rateS(E.wasteFree(s), 'L'));
        h += '<div class="tw">洗缶' + (s.era >= 2 ? 'と、溶解・塩素化などの洗浄' : '') + 'で出る水。流せない水は出せないので、<b>満水になると、排水を出す工程は流せる分しか動けなくなる</b>' + (s.era >= 2 ? '（製造が止まる）' : '（洗缶が止まる）') + '。' + (s.era >= 2 ? '中和槽・凝集沈殿槽で処理すれば流せる量が増える。' : '排水桝・ためすすぎで、流せる量を増やせる。') + '</div>';
      }
      if (cap !== Infinity && v >= cap * 0.995) {
        var bl = stalledBy(d, id, 'full');
        h += '<div class="tw warn">置き場がいっぱい。' + (bl.length ? '止まっている：' + bl.slice(0, 3).join('、') : 'これ以上は増えない') + '</div>';
      } else if (balState[id]) { /* 釣り合っている間は残り時間を出さない */ }
      else if (net > 1e-9 && cap !== Infinity) h += '<div class="tw">あと ' + U.fmtTime((cap - v) / net) + ' で満杯</div>';
      else if (net < -1e-9 && v > 0) h += '<div class="tw ' + (v / -net < 60 ? 'bad' : '') + '">あと ' + U.fmtTime(v / -net) + ' で空になる</div>';
      var st = stalledBy(d, id, 'in');
      if (st.length) h += '<div class="tw bad">足りない → 待っている：' + st.slice(0, 3).join('、') + '</div>';
      h += ledger(s, d, id, unit);
      return h;
    }
    if (kind === 'x') {
      if (id === 'pop') {
        h += '<div class="tt">人手</div>' + line('人数', s.pop + ' / ' + d.popCap + '人') + line('手すき', E.idle(s) + '人');
        if (s.res.money < 0 && s.pop < d.popCap) h += '<div class="tw warn">お金を借りている間は、新しい人が来ない。</div>';
        else if (s.pop >= d.popCap) h += '<div class="tw warn">住む場所がいっぱい。寮などを建てると、また人が来る。</div>';
        else if (d.arrivalLeft !== undefined && s.flags.hired) h += '<div class="tw">次の人が来るまで あと ' + U.fmtTime(Math.max(0, d.arrivalLeft)) + '</div>';
        h += line('給料', rateS(-(d.salary || 0), '円'), 'bad');
        return h;
      }
      if (id === 'power') return '<div class="tt">電力</div>' + line('使う / 使える', f(d.powerDem) + ' / ' + f(d.powerSup)) + '<div class="tw">' + (d.powerEff < 1 ? '<span class="bad">足りない。電気を使う設備がすべて ' + Math.round(d.powerEff * 100) + '% の速さに落ちている。</span>' : 'まだ余裕がある（あと ' + f(d.powerSup - d.powerDem) + '）。') + '</div>';
      if (id === 'handling') return '<div class="tt">荷役</div>' + line('要る / 動かせる', f(d.handDem) + ' / ' + f(d.handSup)) + '<div class="tw">' + (d.handEff < 1 ? '<span class="bad">足りない。出荷と荷を使う設備が ' + Math.round(d.handEff * 100) + '% に落ちている。荷役の人手・フォークリフトを。</span>' : '荷を動かす力には余裕がある。') + '</div>';
      if (id === 'vent') return '<div class="tt">換気</div><div class="tw">' + (d.ventEff < 1 ? '<span class="bad">酸の霧がこもり、溶かす作業が ' + Math.round(d.ventEff * 100) + '% に落ちている。換気扇・スクラバーを。</span>' : '風は通っている。') + '</div>';
      if (id === 'land') return '<div class="tt">敷地</div>' + line('使っている / 広さ', f(d.used) + ' / ' + f(d.land)) + '<div class="tw">' + (d.used >= d.land * 0.95 ? '<span class="warn">ほとんど空きがない。隣の空き地を。</span>' : 'あと ' + f(d.land - d.used) + ' 空いている。') + '</div>';
      if (id === 'creditline') return '<div class="tt">与信枠</div>' + line('枠', f(d.creditLimit) + '円') + (s.res.money < 0 ? line('借りている', f(-s.res.money) + '円', 'bad') + line('利息', rateS(-(d.interest || 0), '円'), 'bad') : '') + '<div class="tw">お金が足りなくても、この枠の中なら<b>設備・仕入れ・給料</b>に使える。借りている間は<b>利息</b>がつき、新しい人は来ない。<b>枠を超えたまま1分たつと、設備を1つずつ手放す</b>（いちばん高く売れるもの、売値は半額）。枠は信用と稼ぎで広がる。</div>';
      if (id === 'circ') return '<div class="tt">循環率</div><div class="tw">捨てていたものを回収するほど上がる。高いほど、すべての生産と単価が上がる。</div>';
      return '';
    }
    if (kind === 'act') {
      var a = E.actions[id], hm = a.heat && s.era >= 1 ? E.heatMul(s, a.heat) : 1, e1 = s.era >= 1;
      h += '<div class="tt">' + E.actLabel(s, id) + '</div>';
      var desc = {
        grope: '暗がりを手で探る。',
        pick: e1 ? '鉄くずを1つ拾う。押すたびに回収を手伝い、しばらく回収（とスクラップの買い付け）が速くなる。' : '鉄くずを1つ拾う。',
        sink: e1 ? '鉄くず1つと塩酸2kgを、その場で溶かす（緑の液3kg）。押すたびに溶解を手伝い、しばらく溶解・反応槽が速くなる。' : '鉄くず1つと酸2kgを壺に沈める。3秒で緑の液が3kgできる。',
        give: e1 ? '店先の客に売る。押すたびに呼び込みになり、しばらく客の足と配達が速くなる。' : '戸口の客に緑の液を渡す（1kg ' + C.walkinPrice + '円）。',
        buyacid: '塩酸' + C.acidBuy.kg + 'kgを' + C.acidBuy.cost + '円で買う。お金が足りなくても、与信枠の中なら買える（利息がつく）。',
        hire: '人を1人呼ぶ。鉄くずを集めてくれる。',
        setkama: '釜を据える。',
        buycans: '空きポリ缶を' + C.canBuy.n + '個、' + C.canBuy.cost + '円で買う。'
      }[id] || '';
      h += '<div class="tw">' + desc + '</div>';
      if (a.heat && e1) h += line('いまの手伝い', '×' + hm.toFixed(2), hm > 1.02 ? 'good' : 'dim') + '<div class="tw dim">速く押すほど上がる（最大 ×2）。手を止めると数秒で戻る。</div>';
      if (id === 'pick' && s.res.scrap >= d.cap.scrap) h += '<div class="tw warn">鉄くず置き場がいっぱい（手伝いは効く）。</div>';
      if (id === 'sink' && e1 && !(s.res.scrap >= 1 && s.res.hcl >= 2)) h += '<div class="tw warn">鉄くずか塩酸が足りないので、その場では溶かせない（手伝いは効く）。</div>';
      if (id === 'give' && e1) h += line('待っている客', f(s.walkin) + 'kgぶん');
      return h;
    }
    if (kind === 'bld') {
      var b = E.BLD[id], o = s.bld[id], c = E.cost(s, b);
      h += '<div class="tt">' + b.name + (o.n ? '（' + o.n + '）' : '') + '</div><div class="tw">' + b.desc + '</div>';
      h += bldDetail(s, d, b);
      var why = E.whyNot(s, b);
      if (why && why !== 'お金・資材が足りない') h += '<div class="tw warn">' + why + '</div>';
      else if (why) { var tt = timeTo(s, d, c); h += '<div class="tw">' + (tt === -1 ? '置き場が足りない（この値段はためられない）' : tt === Infinity ? 'このままでは貯まらない' : 'あと ' + U.fmtTime(tt) + ' で買える') + '</div>'; }
      var pi = procOf(d, 'bld.' + id);
      if (pi && o.n && pi.reason) h += '<div class="tw bad">いま：' + pi.reason + '</div>';
      return h;
    }
    if (kind === 'job') {
      var j = E.JOB[id], n = s.jobs[id] || 0;
      h += '<div class="tt">' + j.name + '（' + n + '人）</div><div class="tw">' + j.desc + '</div>';
      var per = mulOf(d, 'job.' + id) * (d.m['job.all'] ? 1 + d.m['job.all'] : 1) * eff(s, d) * (d.glob || 1);
      if (j.out && !j.special) {
        var ps = [], k;
        for (k in j.out) ps.push(E.resName(s, k) + ' ' + rateS(j.out[k] * per));
        var pin = []; for (k in j.in) pin.push(E.resName(s, k) + ' ' + rateS(j.in[k] * per));
        h += line('1人で', (pin.length ? pin.join('・') + ' → ' : '') + ps.join('・'));
      }
      if (id === 'fill') h += line('1人で', rateS(j.rate * per) + '缶（手で詰める）');
      if (id === 'deliver') h += line('歩いて1人で', rateS(j.rate * mulOf(d, 'walk') * mulOf(d, 'job.deliver')) + '缶') + '<div class="tw dim">車があれば、運転手として先に車へ乗る。</div>';
      if (id === 'check') h += line('1人で', rateS(0.6 * per) + 'kg');
      if (id === 'handle') h += line('1人で', '荷役 ' + f(j.rate * per));
      if (j.slotsFrom) h += line('置ける人数', (d.slots[j.slotsFrom] || 0) + '人（釜1つに2人）', n > (d.slots[j.slotsFrom] || 0) ? 'bad' : '');
      var pj = procOf(d, 'job.' + id);
      if (pj && pj.reason && n) h += '<div class="tw bad">いま：' + pj.reason + '</div>';
      return h;
    }
    if (kind === 'tech' || kind === 'upg') {
      var x = kind === 'tech' ? E.TECH[id] : E.UPG[id];
      h += '<div class="tt">' + x.name + '</div><div class="tw">' + x.desc + '</div>';
      if (!E.canPay(s, x.cost)) { var t3 = timeTo(s, d, x.cost); h += '<div class="tw">' + (t3 === -1 ? 'ためておける量が足りない' : t3 === Infinity ? 'このままでは貯まらない' : 'あと ' + U.fmtTime(t3) + ' で手が届く') + '</div>'; }
      return h;
    }
    if (kind === 'flowdet') return flowDet ? '<div class="tw">' + flowDet + '</div>' : '';
    if (kind === 'flow') {
      var nm = { in: '仕入れ', make: 'つくる', fill: '詰める', sell: '売る' }[id];
      h += '<div class="tt">' + nm + '</div>';
      if (id === 'in') {
        h += '<div class="tw dim">原料を集めて、置き場にためる。</div>';
        ['scrap', 'hcl', 'urea'].forEach(function (k) { if (s.flags['r_' + k]) h += line(E.resName(s, k), f(s.res[k]) + ' / ' + f(d.cap[k]) + '　' + (fr(RT(d)[k] || 0) || '±0'), s.res[k] >= d.cap[k] * 0.9 ? 'warn' : s.res[k] < d.cap[k] * 0.05 ? 'bad' : ''); });
      } else if (id === 'make') {
        h += '<div class="tw dim">原料を溶かし、液にする。</div>';
        (d.procs || []).forEach(function (p) { if (E.procStage(p.key) === 'make' && (p.want > 0 || p.reason)) h += line(p.name, Math.round(p.want > 0 ? p.rate / p.want * 100 : 0) + '%' + (p.reason ? '　' + p.reason : ''), p.reason ? 'bad' : ''); });
      } else if (id === 'fill') {
        h += '<div class="tw dim">液を缶に詰める。</div>' + line('詰めている', rateS(d.filledS || 0, '缶') + '（詰められる ' + rateS(d.fillCap || 0, '缶') + '）') + line('空きポリ缶', f(s.res.can) + ' / ' + f(d.cap.can), s.res.can < 1 ? 'bad' : '');
      } else if (id === 'sell') {
        h += '<div class="tw dim">注文に応じて出荷する。左から：出荷 / 注文</div>';
        if (d.walkinInc) h += line('店先の客', rateS(d.walkinInc, '円'));
        (d.sales || []).forEach(function (x) { if (s.flags['r_' + x.stock] && x.dem > 0 && (x.p.kind !== 'bulk' || x.zone >= 0)) h += line(x.p.name, (fr(x.rate) || '0').replace('+', '') + ' / ' + (fr(x.dem) || '0').replace('+', ''), x.rate < x.dem * 0.9 ? 'warn' : ''); });
      }
      return h;
    }
    return '';
  }
  function mulOf(d, k) { return 1 + ((d.m && d.m[k]) || 0); }
  /* 設備の中身：何を入れて何が出るか、何が増えるか */
  function bldDetail(s, d, b) {
    var h = '', p = b.proc, e = b.effects || {}, k, parts;
    var mm = mulOf(d, 'bld.' + b.id) * (d.glob || 1), om = mulOf(d, 'bld.' + b.id + '.out');
    if (p && p.out && (Object.keys(p.out).length || (p.in && Object.keys(p.in).length))) {
      var ins = [], outs = [];
      for (k in (p.in || {})) ins.push((k === 'money' ? 'お金 ' + rateS(p.in[k] * mm, '円') : E.resName(s, k) + ' ' + rateS(p.in[k] * mm)).replace('+', ''));
      for (k in p.out) outs.push((k === 'money' ? 'お金 ' + rateS(p.out[k] * mm * om, '円') : E.resName(s, k) + ' ' + rateS(p.out[k] * mm * om)).replace('+', ''));
      h += line('1つで', (ins.length ? ins.join('・') : '') + ' → ' + (outs.length ? outs.join('・') : '（処理する）'));
    }
    var need = [];
    if (p && p.power) need.push('電力 ' + p.power);
    if (p && p.operator) need.push('運転の人手 1人');
    if (p && p.handling) need.push('荷役 ' + p.handling);
    if (p && p.needs) need.push(E.BLD[p.needs].name);
    if (p && p.rinse && s.era >= 2) need.push('洗浄の排水を流す余裕（満水だと止まる）');
    if (e.needs) need.push(E.BLD[e.needs].name);
    if (b.space) need.push('敷地 ' + b.space);
    if (need.length) h += line('要るもの', need.join('・'));
    parts = [];
    if (e.cap) { var cs = []; for (k in e.cap) if (E.RES[k] && (s.flags['r_' + k] || k === 'research')) cs.push(E.resName(s, k) + ' +' + f(e.cap[k])); if (cs.length) parts.push('置ける量：' + cs.slice(0, 4).join('、') + (cs.length > 4 ? ' ほか' : '')); }
    if (e.popCap) parts.push('住める人 +' + e.popCap);
    if (e.land) parts.push('敷地 +' + e.land);
    if (e.power) parts.push('電力 +' + f(e.power));
    if (e.slots) parts.push('溶解の人手を ' + e.slots.dissolve + '人まで置ける');
    if (e.transport) parts.push('運ぶ：' + f(e.transport.rate) + (e.transport.kind === 'bulk' ? 'kg' : '缶') + '/秒・' + D.zones[e.transport.zone].name + 'まで' + (e.transport.license ? '（' + E.LIC[e.transport.license].name + '）' : ''));
    if (e.vent) parts.push('換気 +' + e.vent);
    if (e.checkCap) parts.push('検査 +' + e.checkCap + 'kg/秒');
    if (e.quality) parts.push('品質 +' + Math.round(e.quality * 100) + '%');
    if (e.forklift) parts.push('荷役 +' + e.forklift + '（1台）');
    if (e.crane) parts.push('荷役 +' + e.crane);
    if (e.autohandle) parts.push('荷役 +' + e.autohandle);
    if (e.filler) parts.push('充填 +' + e.filler + '缶/秒');
    if (e.gmul) parts.push('すべての生産 ×' + e.gmul);
    if (e.bigpack) parts.push('注文 +25%');
    if (e.hclRecover) parts.push('排気の酸を回収');
    if (parts.length) h += line('効き目', parts.join('<br>'));
    return h;
  }

  /* ============ 設定 ============ */
  function openModal(html, onMount) {
    var m = $('modal'), b = $('modalbox');
    b.innerHTML = html; m.classList.remove('hidden');
    if (onMount) onMount(b);
  }
  function closeModal() { $('modal').classList.add('hidden'); }

  function openSettings() {
    var s = S();
    openModal('<h2>設定</h2>' +
      '<div class="sect"><label><input type="checkbox" id="o_expo" ' + (s.settings.expo ? 'checked' : '') + '> 大きな数を指数で表示（1.2e45）</label>' +
      '<label><input type="checkbox" id="o_anim" ' + (s.settings.anim ? 'checked' : '') + '> 表示のふわっとした動き</label>' +
      '<label><input type="checkbox" id="o_gag" ' + (s.settings.gag !== false ? 'checked' : '') + '> タイトルの小ネタ</label></div>' +
      '<div class="sect"><b style="font-weight:normal">セーブの書き出し（別のPC・ブラウザへ引っ越すとき）</b><textarea id="o_exp" readonly></textarea>' +
      '<button class="mini" id="o_copy">コピー</button></div>' +
      '<div class="sect"><b style="font-weight:normal">セーブの読み込み</b><textarea id="o_imp" placeholder="ここに書き出した文字を貼り付け"></textarea><button class="mini" id="o_load">読み込む</button></div>' +
      '<div class="sect"><button class="mini" id="o_wipe">最初からやり直す</button>　<button class="mini" id="o_dev">開発者モード</button></div>' +
      '<div class="sect" style="text-align:right"><button class="btn" data-a="close">閉じる</button></div>',
    function (b) {
      b.querySelector('#o_exp').value = E.exportText(s);
      b.querySelector('#o_expo').onchange = function (e) { s.settings.expo = e.target.checked; lastSig = {}; };
      b.querySelector('#o_anim').onchange = function (e) { s.settings.anim = e.target.checked; };
      b.querySelector('#o_gag').onchange = function (e) { s.settings.gag = e.target.checked; };
      b.querySelector('#o_copy').onclick = function () { var t = b.querySelector('#o_exp'); t.select(); try { document.execCommand('copy'); } catch (e) { /* 無視 */ } };
      b.querySelector('#o_load').onclick = function () {
        try { var ns = E.importText(b.querySelector('#o_imp').value); TM.state = ns; E.save(ns); lastSig = {}; closeModal(); alert('読み込みました。'); }
        catch (e) { alert('読み込めませんでした。文字が欠けていないか確かめてください。'); }
      };
      b.querySelector('#o_wipe').onclick = function () {
        if (!confirm('セーブを消して最初からやり直しますか？')) return;
        if (!confirm('本当に消しますか？（元に戻せません）')) return;
        E.wipe(); TM.state = E.newState(); lastSig = {}; closeModal();
      };
      b.querySelector('#o_dev').onclick = function () { if (TM.Dev) TM.Dev.ask(); };
    });
  }

  function resetSig() { lastSig = {}; }

  return { init: init, render: render, openModal: openModal, closeModal: closeModal, resetSig: resetSig, f: f };
})();

</script>
<script>
/* 開発者モード（パスワード 1234）。※画面上の簡易な鍵で、セキュリティのためのものではない */
var TM = window.TM = window.TM || {};

TM.Dev = (function () {
  var E = TM.Engine, U = TM.util;
  var PASS = '1234';
  var on = false;
  TM.speed = 1;
  TM.infMoney = false;

  function ask() {
    TM.UI.openModal('<h2>開発者モード</h2><p class="note">パスワードを入れてください。</p><input type="password" id="dv_pw" autocomplete="off"><div class="sect" style="text-align:right"><button class="mini" id="dv_ok">入る</button> <button class="mini" data-a="close">やめる</button></div>', function (b) {
      var inp = b.querySelector('#dv_pw'); inp.focus();
      function go() {
        if (inp.value === PASS) { TM.UI.closeModal(); enable(); }
        else { inp.value = ''; inp.placeholder = 'ちがいます'; }
      }
      b.querySelector('#dv_ok').onclick = go;
      inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    });
  }

  function enable() {
    on = true;
    try { localStorage.setItem('taiki-minigame-dev', '1'); } catch (e) { /* 無視 */ }
    draw();
  }
  function disable() {
    on = false; TM.speed = 1; TM.infMoney = false;
    try { localStorage.removeItem('taiki-minigame-dev'); } catch (e) { /* 無視 */ }
    document.getElementById('devpanel').classList.add('hidden');
  }

  function draw() {
    var p = document.getElementById('devpanel');
    p.classList.remove('hidden');
    var sp = [1, 10, 100, 1000, 10000].map(function (x) { return '<button data-dv="speed" data-v="' + x + '" class="' + (TM.speed === x ? 'on' : '') + '">×' + x + '</button>'; }).join('');
    p.innerHTML = '<h4>開発者モード</h4>' +
      '<div>速度 ' + sp + '</div>' +
      '<div><button data-dv="money" class="' + (TM.infMoney ? 'on' : '') + '">お金無限 ' + (TM.infMoney ? 'ON' : 'OFF') + '</button>' +
      '<button data-dv="add" data-v="1e4">+1万円</button><button data-dv="add" data-v="1e6">+100万円</button><button data-dv="add" data-v="1e8">+1億円</button></div>' +
      '<div><button data-dv="fill">資源を満タン</button><button data-dv="research">技術+大量</button></div>' +
      '<div>時間を進める <button data-dv="skip" data-v="600">+10分</button><button data-dv="skip" data-v="3600">+1時間</button><button data-dv="skip" data-v="28800">+8時間</button></div>' +
      '<div><button data-dv="pop">人手+10</button><button data-dv="techs">技術を全部</button><button data-dv="era">次の時代へ</button><button data-dv="reveal">全部見せる</button></div>' +
      '<div>自動プレイで計測 <button data-dv="sim" data-v="heavy">ヘビー</button><button data-dv="sim" data-v="normal">ふつう</button><button data-dv="sim" data-v="light">ライト</button></div>' +
      '<div><button data-dv="dump">状態をコピー</button><button data-dv="off">終了</button></div>' +
      '<pre id="dv_out"></pre>';
  }

  function onClick(e) {
    var t = e.target.closest('[data-dv]'); if (!t || !on) return;
    var a = t.getAttribute('data-dv'), v = t.getAttribute('data-v');
    var s = TM.state, d = E.derive(s);
    var out = document.getElementById('dv_out');
    switch (a) {
      case 'speed': TM.speed = +v; break;
      case 'money': TM.infMoney = !TM.infMoney; break;
      case 'add': s.res.money += +v; break;
      case 'fill':
        for (var k in s.res) { if (d.cap[k] !== undefined && d.cap[k] !== Infinity) s.res[k] = d.cap[k]; }
        s.res.money = Math.max(s.res.money, 1e6 * Math.pow(100, s.era));
        break;
      case 'research': s.res.research += Math.max(1000, (s.res.research || 0)) * 100; if (d.cap.research !== Infinity) s.res.research = Math.max(s.res.research, 0); break;
      case 'skip': out.textContent = '計算中…'; setTimeout(function () { var r = E.simulateAway(s, +v); document.getElementById('dv_out').textContent = U.fmtTime(r.simulated) + ' 進めました'; TM.UI.resetSig(); }, 10); break;
      case 'pop': s.pop += 10; break;
      case 'techs': TM.DATA.techs.forEach(function (t2) { if (!s.techs[t2.id]) { s.techs[t2.id] = true; if (t2.setFlag) s.flags[t2.setFlag] = true; } }); break;
      case 'era':
        if (s.era === 0) { s.bld.kama.n = 1; s.era = 1; s.flags.hired = true; s.pop = Math.max(s.pop, 3); s.flags.kama_reveal = true; }
        else {
          var mega = null; TM.DATA.buildings.forEach(function (b) { if (b.stages && b.onComplete && b.onComplete.era === s.era + 1) mega = b; });
          if (mega) {
            TM.DATA.techs.forEach(function (t3) { if ((t3.era || 0) <= s.era && !s.techs[t3.id]) { s.techs[t3.id] = true; if (t3.setFlag) s.flags[t3.setFlag] = true; } });
            /* 大型設備を完成させたことにする（条件は無視） */
            s.bld[mega.id].n = mega.stages;
            var oc = mega.onComplete || {};
            if (oc.era !== undefined && s.era < oc.era) { s.era = oc.era; s.stats.at['era' + oc.era] = s.t; }
            if (oc.ending) { s.ending = 1; s.stats.ended = 1; }
            s.res.money = Math.max(s.res.money, 10 * (E.cost(s, mega).money || 0));
            E.addLog(s, '（開発者モード）' + mega.name + 'を完成させた。', 'dim');
          }
        }
        TM.UI.resetSig(); break;
      case 'reveal':
        TM.DATA.buildings.forEach(function (b) { if (E.cond(s, b.unlock)) s.shown['b:' + b.id] = -1e9; });
        TM.DATA.upgrades.forEach(function (u) { if (E.cond(s, u.unlock)) s.shown['u:' + u.id] = -1e9; });
        TM.DATA.techs.forEach(function (t4) { s.shown['t:' + t4.id] = -1e9; });
        ['hook', 'memo', 'research_known', 'cans_known', 'dcan_known', 'smoke', 'power_known', 'acid_known', 'fecl2_known', 'space_tight'].forEach(function (fl) { s.flags[fl] = true; }); TM.UI.resetSig(); break;
      case 'sim':
        out.textContent = '自動プレイ中…（数十秒〜数分かかります）';
        setTimeout(function () {
          var t0 = Date.now(), r = TM.Sim.run(v, 16);
          var lines = [r.style + '（' + ((Date.now() - t0) / 1000).toFixed(0) + '秒で計算）'];
          Object.keys(r.milestones).forEach(function (k) { lines.push(k + '：' + (r.milestones[k] / 3600).toFixed(1) + '時間（' + (r.milestones[k] / 86400).toFixed(2) + '日）'); });
          if (!r.milestones.ending) lines.push('16日でエンディングに届かず（時代' + r.state.era + '）');
          document.getElementById('dv_out').textContent = lines.join('\n');
        }, 30);
        break;
      case 'dump':
        try { navigator.clipboard.writeText(E.exportText(s)); out.textContent = 'セーブ文字列をコピーしました'; } catch (e2) { out.textContent = E.exportText(s); }
        break;
      case 'off': disable(); return;
    }
    var keep = document.getElementById('dv_out').textContent;
    draw();
    document.getElementById('dv_out').textContent = keep;
  }

  function init() {
    document.getElementById('devpanel').addEventListener('click', onClick);
    try { if (localStorage.getItem('taiki-minigame-dev') === '1') enable(); } catch (e) { /* 無視 */ }
  }

  /* 毎ティック：お金無限 */
  function tick(s) { if (on && TM.infMoney) s.res.money = Math.max(s.res.money, 1e15 * Math.pow(1e6, Math.max(0, s.era - 3))); }

  return { ask: ask, init: init, tick: tick, isOn: function () { return on; } };
})();

</script>
<script>
/* 起動・ループ・保存・留守中の進行・エンディング */
(function () {
  var TM = window.TM, E = TM.Engine, U = TM.util;
  E.init();
  TM.UI.init();
  TM.Dev.init();

  var storageOk = true;
  try { localStorage.setItem('taiki-minigame-test', '1'); localStorage.removeItem('taiki-minigame-test'); } catch (e) { storageOk = false; }

  var s = E.load();
  var report = null;
  if (s) {
    var away = (Date.now() - (s.saved || Date.now())) / 1000;
    if (away > 60 && s.era >= 1 && !s.ending) {
      var before = U.deepCopy(s.res);
      var r = E.simulateAway(s, away);
      report = { away: away, sim: r.simulated, before: before };
    }
  } else {
    s = E.newState();
  }
  TM.state = s;
  if (!storageOk) E.addLog(s, '（この環境ではセーブができない。設定から書き出しておくと安心。）', 'dim');

  function showReport(rep) {
    var st = TM.state, rows = '', k;
    var list = [];
    for (k in st.res) {
      var diff = st.res[k] - (rep.before[k] || 0);
      if (Math.abs(diff) > 0.5 && st.flags['r_' + k]) list.push([k, diff]);
    }
    list.sort(function (a, b) { return a[0] === 'money' ? -1 : b[0] === 'money' ? 1 : 0; });
    list.slice(0, 14).forEach(function (x) {
      rows += '<tr><td>' + E.resName(st, x[0]) + '</td><td class="' + (x[1] >= 0 ? 'good' : 'bad') + '">' + (x[1] >= 0 ? '+' : '') + U.fmt(x[1], st.settings.expo) + '</td></tr>';
    });
    TM.UI.openModal('<h2>留守中の記録</h2><p class="note">留守にしていた時間：' + U.fmtTime(rep.away) + '（進んだのは ' + U.fmtTime(rep.sim) + ' ぶん。12時間までは全部、そこから72時間までは4分の1の速さで進む）</p>' +
      '<table class="t">' + rows + '</table><div class="sect" style="text-align:right"><button class="btn" data-a="close">続ける</button></div>');
  }
  if (report && report.away > 120) showReport(report);

  /* ---- ループ ---- */
  var last = Date.now(), saveTimer = 0;
  function loop() {
    var now = Date.now();
    var real = (now - last) / 1000; last = now;
    var st = TM.state;
    if (st.ending === 1 || st.ending === 2) { TM.UI.render(); return; }
    if (real > 120 && st.era >= 1) {
      /* スリープ復帰など：留守扱い */
      var before = U.deepCopy(st.res);
      var r = E.simulateAway(st, real);
      showReport({ away: real, sim: r.simulated, before: before });
    } else {
      var dt = real * TM.speed;
      var stepSec = TM.speed >= 1000 ? 5 : TM.speed > 1 ? 1 : real > 2 ? 1 : 0.2;
      var n = Math.min(2000, Math.ceil(dt / stepSec));
      for (var i = 0; i < n; i++) { TM.Dev.tick(st); E.step(st, dt / n); }
    }
    TM.UI.render();
    saveTimer += real;
    if (saveTimer > 30) { saveTimer = 0; E.save(st); }
  }
  setInterval(loop, 200);
  TM.UI.render(true);

  document.addEventListener('visibilitychange', function () { if (document.hidden) E.save(TM.state); else last = Date.now() - 200 + Math.min(0, 0); });
  window.addEventListener('beforeunload', function () { E.save(TM.state); });
  window.addEventListener('pagehide', function () { E.save(TM.state); });

  /* ---- エンディング ---- */
  TM.UIEnding = function (st) {
    var box = document.getElementById('ending');
    if (st.ending === 1 && box.getAttribute('data-st') !== '1') {
      box.setAttribute('data-st', '1'); box.classList.remove('hidden');
      box.innerHTML = '<div class="line fade">暗い。</div><div><button class="btn fade" id="end_sink">沈める</button></div>';
      document.getElementById('end_sink').onclick = function () { st.ending = 2; E.save(st); TM.UIEnding(st); };
    }
    if (st.ending === 2 && box.getAttribute('data-st') !== '2') {
      box.setAttribute('data-st', '2'); box.classList.remove('hidden');
      var days = (Date.now() - st.started) / 86400000;
      var lines = ['泡が立つ。', '星が、細くなっていく。', '液が、うすい緑に染まった。', '', '―――', '',
        'タイキ薬品工業　ミニゲーム', '', '遊んでくれて、ありがとうございました。', '',
        '遊び始めてから　' + days.toFixed(1) + '日', '稼いだお金　' + U.fmt(st.stats.earned) + '円', '売った缶　' + U.fmt(st.stats.cansSold) + '缶',
        '洗った缶　' + U.fmt(st.stats.washed) + '缶', '逃がした水素　' + U.fmt(st.stats.h2) + 'kg'];
      box.innerHTML = '<div class="credits">' + lines.map(function (l) { return '<div class="fade">' + (l || '&nbsp;') + '</div>'; }).join('') + '</div>' +
        '<div style="margin-top:20px"><button class="btn" id="end_cont">このまま眺める</button> <button class="btn" id="end_new">はじめから</button></div>';
      document.getElementById('end_cont').onclick = function () { st.ending = 3; box.classList.add('hidden'); E.save(st); };
      document.getElementById('end_new').onclick = function () {
        if (!confirm('セーブを消して、はじめから遊びますか？')) return;
        E.wipe(); TM.state = E.newState(); box.classList.add('hidden'); box.removeAttribute('data-st'); TM.UI.resetSig();
      };
    }
  };
})();

</script>
</body>
</html>
